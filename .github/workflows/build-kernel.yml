name: build kernel (guest)

# The guest kernel alone (kernel.macho), with this repository's XNU changes.
#
# Why: the payload build produces the whole 6 GB release over hours.  A kernel question only needs
# the reference candidate, setup/volumes/policies/data-base (the kernel build attaches the OS volume
# and reads the Data fixture) and `kernel` -- not the plugin, the images or the payload disk.
# DarwinBoot's device tree (kernel.macho.adt) is generated from the VM's FDT, so a rebuilt
# kernel.macho can be dropped onto the boot disk alone.
#
# scripts/apply-xnu-changes.py: two edits to the prepared XNU source, anchored on text that occurs
# once -- 0001 a stale vm_map hole list is a lost hint instead of a panic (validated on the phone),
# 0002 the owner-cache mount reports stage/errno through a panic when booted with owner-cache-diag=1.
#
# They are applied by script, not by `git apply`.  A hand-written unified diff has to agree with its
# own hunk counts, and when it does not one tool says "corrupt patch" while another silently skips
# it: 43600590879 built a 126 MB kernel with `strings | grep 'DroidVM owner-cache'` = 0 that way.
#
# Two things this workflow has been taught by failed runs:
#
# 1. build-droidvm-all.py's own `reference` step cannot be used once the overlay is on.  It derives
#    the reference config by copying droidvm_defconfig and flipping flags to n, so it keeps
#    CONFIG_XNU_EXTRA_LD_ARCHIVES pointing at build/virtio-pci/libVirtioPciDrivers.a while its
#    shortened archive list never builds that library:
#      ld: library '.../tree/build/virtio-pci/libVirtioPciDrivers.a' not found   (43598709618)
#    The supported path is the one below, from the payload workflow: a whole second device
#    repository from make-reference-device.py (which also clears every *_ARCHIVE), built in
#    UniXNU with the ordinary defconfig.
# 2. That candidate has to be placed from the workspace root: the tree lives under
#    UniXNU/out/droidvm, and a workspace-relative path inside a step whose working directory is
#    UniXNU resolves to UniXNU/UniXNU/... (43597066885: "mkdir: UniXNU: Not a directory").
#
# Output: a GitHub Release per run (tag kernel-<date>-r<run_id>) holding kernel.macho and its
# sha256.  A release asset has no 100 MB file limit and needs no token to download.

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        default: 56023cdc363249d201328e9e147f7b05690eba4e
      device_ref:
        default: b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13
  push:
    paths:
      - 'trigger-kernel/**'

permissions:
  contents: write

env:
  BOARD: droidvm
  UNIXNU_REF: ${{ inputs.unixnu_ref || '56023cdc363249d201328e9e147f7b05690eba4e' }}
  DEVICE_REF: ${{ inputs.device_ref || 'b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13' }}
  DATA_VOLUME_UUID: C9B8D4FB-631D-44C4-90AA-35C392D4B8E5
  GITHUB_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/macOS-DroidVM
          ref: main
          path: ci
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
          brew install llvm dtc mtools gnu-sed pkg-config meson bison flex xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          df -h /

      - name: Apply the overlay
        run: |
          set -euo pipefail
          mkdir -p UniXNU-droidvm/patches/xnu UniXNU-droidvm/drivers
          cp ci/overlay/$BOARD/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R ci/overlay/$BOARD/drivers/. UniXNU-droidvm/drivers/
          cp -R ci/overlay/$BOARD/scripts/. UniXNU-droidvm/scripts/
          cp -n UniXNU/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R UniXNU-droidvm device-ref
          python3 ci/scripts/make-reference-device.py device-ref "${BOARD}_defconfig"
          python3 ci/scripts/apply-overlay-board.py UniXNU-droidvm "${BOARD}_defconfig"

      # The series is deliberately not touched: a `patches/xnu/series` entry is applied with
      # `git apply`, which rejects a hand-written diff whose hunk counts drift ("corrupt patch").
      # The two edits live in scripts/apply-xnu-changes.py and run on the prepared source below.

      # The reference candidate: this board's kernel with the native storage / display / owner-root
      # drivers off, built from device-ref.  The storage audit reads it while the real kernel links.
      - name: Build the reference candidate
        working-directory: UniXNU
        run: |
          set -o pipefail
          ./unixnu defconfig "${BOARD}_defconfig" -D ../device-ref 2>&1 | tee "$RUNNER_TEMP/ref.log"
          ./unixnu fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu ipsw fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu build kernel -j "$(sysctl -n hw.ncpu)" 2>&1 | tee "$RUNNER_TEMP/ref-kernel.log"
          mkdir -p "$RUNNER_TEMP/ref"
          cp "out/$BOARD/kernel/kernel.macho" "out/$BOARD/kernel/kernel.json" "$RUNNER_TEMP/ref/"
          ls -l "$RUNNER_TEMP/ref"
          echo "reference candidate: $(wc -c < "$RUNNER_TEMP/ref/kernel.macho") bytes"

      - name: Sources, volumes, policies, Data fixture
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --to data-base 2>&1 | tee "$RUNNER_TEMP/kernel-1.log"
          df -h /

      # Keep the kernel's Data UUID equal to the one on the phone's data-store.img (apply_data_uuid
      # stamps whatever UUID the freshly built fixture has, and every build makes a new one).
      - name: Pin the Data volume UUID
        run: |
          set -euo pipefail
          seed=UniXNU/out/droidvm/tree/build/owner-data-fixture/seed.json
          ls -l "$seed"
          python3 - "$seed" "$DATA_VOLUME_UUID" <<'PY'
          import json, sys
          path, uuid = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          print('fixture uuid', data.get('volume_uuid'), '->', uuid)
          data['volume_uuid'] = uuid
          json.dump(data, open(path, 'w'), indent=2)
          PY

      # From the workspace root: the tree lives under UniXNU/out/droidvm, and the candidate is read
      # from there while the real kernel links.
      - name: Place the reference candidate in the tree
        run: |
          set -euo pipefail
          for ref in "UniXNU/out/droidvm/tree/build/reference-candidate" \
                     "UniXNU-droidvm/out/droidvm/tree/build/reference-candidate"; do
            mkdir -p "$ref"
            cp "$RUNNER_TEMP/ref/kernel.macho" "$RUNNER_TEMP/ref/kernel.json" "$ref/"
            echo "== $ref"; ls -l "$ref"
          done

      # The tree is prepared by the step above (unixnu tree assembles it and applies the series to
      # .cache/xnu-work).  These two edits anchor on unique text and assert their own result, so a
      # silent no-op is impossible: the step fails instead.
      - name: Apply this repository's XNU changes to the prepared source
        run: |
          set -o pipefail
          python3 self/scripts/apply-xnu-changes.py \
            UniXNU/out/droidvm/tree/.cache/xnu-work 2>&1 | tee "$RUNNER_TEMP/apply.log"

      # 43600590879 built a kernel whose `strings | grep 'DroidVM owner-cache'` was 0: either the
      # edits never reached the prepared source, or the output is not compiled from it.  Print both
      # sides of that question before the build, so one run answers it.
      - name: Audit the source the compiler will read
        if: always()
        run: |
          set +e
          W=UniXNU/out/droidvm/tree/.cache/xnu-work
          echo "=== markers in the prepared source ==="
          echo "0001 comment:      $(grep -c 'DroidVM: the hole list is a hint' "$W/osfmk/vm/vm_map_store_rb.c" 2>/dev/null)"
          echo "0001 panic left:   $(grep -c 'Illegal action: h1:' "$W/osfmk/vm/vm_map_store_rb.c" 2>/dev/null)"
          echo "0002 diagnostic:   $(grep -c 'DroidVM owner-cache' "$W/bsd/kern/kern_exec.c" 2>/dev/null)"
          echo "=== the work tree ==="
          git -C "$W" log --oneline -1 2>/dev/null
          git -C "$W" status --short 2>/dev/null | head -12

      - name: Build the kernel
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          # Idempotent: re-applies the two edits if this step's own prepare pass re-created the tree.
          python3 "$GITHUB_WORKSPACE/self/scripts/apply-xnu-changes.py" \
            "$GITHUB_WORKSPACE/UniXNU/out/droidvm/tree/.cache/xnu-work"
          python3 scripts/build-droidvm-all.py --only kernel 2>&1 | tee "$RUNNER_TEMP/kernel-2.log"
          df -h /

      - name: Self-check
        if: always()
        run: |
          K=UniXNU/out/droidvm/kernel/kernel.macho
          ls -l "$K" || { echo "::error::no kernel built"; exit 1; }
          echo "data uuid strings: $(strings "$K" | grep -c "$DATA_VOLUME_UUID" || true)"
          echo "diagnostic marker: $(strings "$K" | grep -c 'DroidVM owner-cache' || true)"
          df -h /

      # Insurance: an artifact does not depend on the release call behaving, so a good build is not
      # thrown away by a publish failure (43600590879 was).
      - name: Keep the built kernel as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-macho-${{ github.run_id }}
          path: UniXNU/out/droidvm/kernel/kernel.macho
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      # A release asset has no 100 MB file limit and downloads without a token, which is what the
      # machine that installs this kernel on the phone needs.
      - name: Publish the kernel as a release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          K=UniXNU/out/droidvm/kernel/kernel.macho
          TAG="kernel-$(date -u +%Y%m%d)-r${RUN_ID}"
          sum=$(shasum -a 256 "$K" | awk '{print $1}')
          printf '%s  kernel.macho\n' "$sum" > "$RUNNER_TEMP/kernel.macho.sha256"
          notes="guest kernel.macho, $(date -u '+%F %T UTC'), run ${RUN_ID}, sha256 ${sum}"
          echo "tag=$TAG sha256=$sum"
          # -R: this repository is checked out at self/, so the workspace root is not a git
          # repository and gh cannot infer the remote from it ("fatal: not a git repository").
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" \
            "$K" "$RUNNER_TEMP/kernel.macho.sha256" \
            || gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
                 "$K" "$RUNNER_TEMP/kernel.macho.sha256"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) \(.url)"'
