name: build kernel (guest)

# The guest kernel alone (kernel.macho), with this repository's XNU patches.
#
# Why: the payload build produces the whole 6 GB release over hours.  A kernel question only
# needs setup/volumes/policies/data-base, the built-in `reference` step (the storage/display ABI
# audits inside `kernel` read that candidate) and `kernel` itself -- not the plugin, the images or
# the payload disk.  DarwinBoot's device tree (kernel.macho.adt) is generated from the VM's FDT,
# so a rebuilt kernel.macho can be dropped onto the boot disk alone.
#
# patches/0001: a stale vm_map hole list is a lost hint, not a panic (validated on the phone).
# patches/0002: the owner-cache mount reports stage/errno through a panic, behind
#               owner-cache-diag=1 -- the only channel this kernel can be read through.
#
# Output: a GitHub Release per run (tag kernel-<date>-r<run_id>) holding kernel.macho and its
# sha256.  A release asset has no 100 MB file limit and needs no token to download.
#
# The Data volume UUID is pinned between data-base and the reference/kernel steps:
# apply_data_uuid() stamps the kernel with the freshly built fixture's UUID and every build makes
# a new one, while the phone's data-store.img carries the UUID of the release this kernel is
# meant to run with.

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        default: 56023cdc363249d201328e9e147f7b05690eba4e
      device_ref:
        default: b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13
  push:
    paths:
      - 'trigger-kernel/**'

permissions:
  contents: write

env:
  BOARD: droidvm
  UNIXNU_REF: ${{ inputs.unixnu_ref || '56023cdc363249d201328e9e147f7b05690eba4e' }}
  DEVICE_REF: ${{ inputs.device_ref || 'b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13' }}
  DATA_VOLUME_UUID: C9B8D4FB-631D-44C4-90AA-35C392D4B8E5
  GITHUB_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/macOS-DroidVM
          ref: main
          path: ci
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
          brew install llvm dtc mtools gnu-sed pkg-config meson bison flex xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          df -h /

      - name: Apply the overlay
        run: |
          set -euo pipefail
          mkdir -p UniXNU-droidvm/patches/xnu UniXNU-droidvm/drivers
          cp ci/overlay/$BOARD/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R ci/overlay/$BOARD/drivers/. UniXNU-droidvm/drivers/
          cp -R ci/overlay/$BOARD/scripts/. UniXNU-droidvm/scripts/
          cp -n UniXNU/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R UniXNU-droidvm device-ref
          python3 ci/scripts/make-reference-device.py device-ref "${BOARD}_defconfig"
          python3 ci/scripts/apply-overlay-board.py UniXNU-droidvm "${BOARD}_defconfig"

      - name: Add this repository's XNU patches to the series
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in self/patches/*.patch; do
            base=$(basename "$p")
            cp "$p" "UniXNU/patches/xnu/$base"
            for series in UniXNU/profiles/arch/*/patches/xnu/series; do
              echo "../../../../../patches/xnu/$base" >> "$series"
              echo "$series += $base"
            done
          done
          tail -4 UniXNU/profiles/arch/arm64/patches/xnu/series

      # setup also downloads the IPSW (about 8 GB); volumes extracts the OS and SystemOS members
      # (about 9 GiB) because the policies and the Data seed are built from them.
      - name: Sources, volumes, policies, Data fixture
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --only setup,volumes,policies,data-base 2>&1 \
            | tee "$RUNNER_TEMP/kernel-1.log"
          df -h /

      # Keep the kernel's Data UUID equal to the one on the phone's data-store.img.  Runs before
      # `reference` and `kernel` so both stamp the same UUID.
      - name: Pin the Data volume UUID
        run: |
          set -euo pipefail
          seed=UniXNU/out/droidvm/tree/build/owner-data-fixture/seed.json
          ls -l "$seed"
          python3 - "$seed" "$DATA_VOLUME_UUID" <<'PY'
          import json, sys
          path, uuid = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          print('fixture uuid', data.get('volume_uuid'), '->', uuid)
          data['volume_uuid'] = uuid
          json.dump(data, open(path, 'w'), indent=2)
          PY

      # `reference` is the candidate the storage-ABI and display audits inside `kernel` read.  It
      # is this board's kernel with those drivers configured off, built in out-reference/ and
      # copied to tree/build/reference-candidate.  It has to be the pipeline's own step: a
      # reference built from the ordinary defconfig still contains the storage drivers, which is
      # exactly what the audit is comparing against.
      - name: Reference candidate and the kernel
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --only reference,kernel 2>&1 \
            | tee "$RUNNER_TEMP/kernel-2.log"
          df -h /

      - name: Self-check
        if: always()
        run: |
          K=UniXNU/out/droidvm/kernel/kernel.macho
          ls -l "$K" || { echo "::error::no kernel built"; exit 1; }
          echo "data uuid strings: $(strings "$K" | grep -c "$DATA_VOLUME_UUID" || true)"
          echo "diagnostic marker: $(strings "$K" | grep -c 'DroidVM owner-cache' || true)"
          echo "--- reference candidate ---"
          ls -l UniXNU/out/droidvm/tree/build/reference-candidate || true
          df -h /

      # A release asset has no 100 MB file limit and downloads without a token, which is what the
      # machine that installs this kernel on the phone needs.
      - name: Publish the kernel as a release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          K=UniXNU/out/droidvm/kernel/kernel.macho
          TAG="kernel-$(date -u +%Y%m%d)-r${RUN_ID}"
          sum=$(shasum -a 256 "$K" | awk '{print $1}')
          printf '%s  kernel.macho\n' "$sum" > "$RUNNER_TEMP/kernel.macho.sha256"
          notes="guest kernel.macho, $(date -u '+%F %T UTC'), run ${RUN_ID}, sha256 ${sum}"
          echo "tag=$TAG sha256=$sum"
          gh release create "$TAG" --title "$TAG" --notes "$notes" \
            "$K" "$RUNNER_TEMP/kernel.macho.sha256" \
            || gh release upload "$TAG" --clobber "$K" "$RUNNER_TEMP/kernel.macho.sha256"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) \(.url)"'
