name: build kernel (guest)
on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        default: 56023cdc363249d201328e9e147f7b05690eba4e
      device_ref:
        default: b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13
      display_ref:
        default: 3da41eaa0f06fd21e7bc1ef17aafe0a3e72d70ff
  push:
    paths:
      - 'trigger-kernel/**'
permissions:
  contents: write
env:
  BOARD: droidvm
  UNIXNU_REF: ${{ inputs.unixnu_ref || '56023cdc363249d201328e9e147f7b05690eba4e' }}
  DEVICE_REF: ${{ inputs.device_ref || 'b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13' }}
  DISPLAY_REF: ${{ inputs.display_ref || '3da41eaa0f06fd21e7bc1ef17aafe0a3e72d70ff' }}
  DATA_VOLUME_UUID: C9B8D4FB-631D-44C4-90AA-35C392D4B8E5
  GITHUB_TOKEN: ${{ github.token }}
defaults:
  run:
    shell: bash
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/macOS-DroidVM
          ref: main
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          set -euo pipefail
          brew install llvm dtc mtools gnu-sed pkg-config meson bison flex xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Apply the overlay
        run: |
          set -euo pipefail
          mkdir -p UniXNU-droidvm/patches/xnu UniXNU-droidvm/drivers
          cp ci/overlay/$BOARD/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R ci/overlay/$BOARD/drivers/. UniXNU-droidvm/drivers/
          cp -R ci/overlay/$BOARD/scripts/. UniXNU-droidvm/scripts/
          cp -n UniXNU/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R UniXNU-droidvm device-ref
          python3 ci/scripts/make-reference-device.py device-ref "${BOARD}_defconfig"
          python3 ci/scripts/apply-overlay-board.py UniXNU-droidvm "${BOARD}_defconfig"
      - name: Take the display driver from the iPadOS branch
        run: |
          set -euo pipefail
          cd UniXNU-droidvm
          git fetch --depth=1 origin "$DISPLAY_REF"
          files=$(git ls-tree --name-only FETCH_HEAD package/ | grep -E '/DroidVMVirtioGpu[^/]*$' || true)
          for f in $files; do git show "FETCH_HEAD:$f" > "$f"; echo "took $f"; done
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('package/DroidVMVirtioGpu3D.cpp')
          t = p.read_text()
          n = 0
          for old, new in (
              ('if (!gSurfaceUses || gSurfaceUseCount == MaxSurfaceUses)',
               'if (gSurfaceUseCount == MaxSurfaceUses)'),
              ('if (gSurfaceUses)',
               'if (reinterpret_cast<uintptr_t>(gSurfaceUses) != 0)'),
          ):
              c = t.count(old)
              if c:
                  t = t.replace(old, new)
                  n += c
          p.write_text(t)
          print('warnings fixed:', n)
          PY
          cd ..

      - name: Probe the base class swap queue and pump
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('UniXNU/drivers/GopFramebuffer/NativeLegacyDisplay.cpp')
          text = path.read_text()
          if 'droidvm_probe_base_swap_ticks' in text:
              print('probe already present')
              raise SystemExit(0)
          # Two globals we can read from the host: how many timer ticks saw a
          # non-null base-class current swap, and the last pointer seen.
          head = (
              'extern "C" {volatile uint64_t droidvm_probe_base_swap_ticks;\n'
              '             volatile uint64_t droidvm_probe_base_swap_ptr;\n'
              '             volatile uint64_t droidvm_probe_tick_count;}\n'
              'volatile uint64_t droidvm_probe_base_swap_ticks=0;\n'
              'volatile uint64_t droidvm_probe_base_swap_ptr=0;\n'
              'volatile uint64_t droidvm_probe_tick_count=0;\n'
          )
          text = head + text
          block = '\n'.join([
              '    IOTimerEventSource *droidvmPump=nullptr;',
              '    static void droidvmPumpFired(OSObject *owner,IOTimerEventSource *) {',
              '        auto *self=static_cast<NativeLegacyDisplay *>(owner);',
              '        droidvm_probe_tick_count=droidvm_probe_tick_count+1;',
              '        const unsigned char *cur=nullptr;',
              '        memcpy(&cur,reinterpret_cast<unsigned char *>(self)+kLegacyCurrentSwap,sizeof(cur));',
              '        if(cur){droidvm_probe_base_swap_ticks=droidvm_probe_base_swap_ticks+1;',
              '                droidvm_probe_base_swap_ptr=(uint64_t)(uintptr_t)cur;}',
              '        self->kickSwapQueue();',
              '    }',
              '    void startDroidvmPump() {',
              '        if(droidvmPump)return;',
              '        droidvmPump=IOTimerEventSource::timerEventSource(this,droidvmPumpFired);',
              '        if(!droidvmPump)return;',
              '        IOWorkLoop *loop=getWorkLoop();',
              '        if(!loop || loop->addEventSource(droidvmPump)!=kIOReturnSuccess){OSSafeReleaseNULL(droidvmPump);return;}',
              '        droidvmPump->setTimeoutMS(16);',
              '    }',
              '',
          ])
          anchor = '    void kickSwapQueue() override {'
          if anchor not in text:
              print('anchor missing; probe skipped')
              raise SystemExit(0)
          text = text.replace(anchor, block + anchor, 1)
          call = '        startVsync();startDirect();return true;'
          if call in text:
              text = text.replace(call, '        startVsync();startDirect();startDroidvmPump();return true;', 1)
          path.write_text(text)
          print('probe + pump added')
          PY
      - name: Build the reference candidate
        working-directory: UniXNU
        run: |
          set -o pipefail
          ./unixnu defconfig "${BOARD}_defconfig" -D ../device-ref 2>&1 | tee "$RUNNER_TEMP/ref.log"
          ./unixnu fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu ipsw fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu build kernel -j "$(sysctl -n hw.ncpu)" 2>&1 | tee "$RUNNER_TEMP/ref-kernel.log"
          mkdir -p "$RUNNER_TEMP/ref"
          cp "out/$BOARD/kernel/kernel.macho" "out/$BOARD/kernel/kernel.json" "$RUNNER_TEMP/ref/"
      - name: Sources, volumes, policies, Data fixture
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --to data-base 2>&1 | tee "$RUNNER_TEMP/kernel-1.log"
      - name: Pin the Data volume UUID
        run: |
          set -euo pipefail
          seed=UniXNU/out/droidvm/tree/build/owner-data-fixture/seed.json
          python3 - "$seed" "$DATA_VOLUME_UUID" <<'PY'
          import json, sys
          path, uuid = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data['volume_uuid'] = uuid
          json.dump(data, open(path, 'w'), indent=2)
          PY
      - name: Place the reference candidate in the tree
        run: |
          set -euo pipefail
          for ref in "UniXNU/out/droidvm/tree/build/reference-candidate" \
                     "UniXNU-droidvm/out/droidvm/tree/build/reference-candidate"; do
            mkdir -p "$ref"
            cp "$RUNNER_TEMP/ref/kernel.macho" "$RUNNER_TEMP/ref/kernel.json" "$ref/"
          done
      - name: Turn this repository's XNU changes into a patch
        run: |
          set -euo pipefail
          W=UniXNU/out/droidvm/tree/.cache/xnu-work
          P="$GITHUB_WORKSPACE/UniXNU/out/droidvm/tree/patches/xnu/zzzz-droidvm-hole-and-diag.patch"
          git -C "$W" add -A
          python3 self/scripts/apply-xnu-changes.py "$W"
          git -C "$W" diff > "$P"
          git -C "$W" reset -q
          git apply --stat "$P" || { echo "::error::bad patch"; exit 1; }
          git -C "$W" apply --reverse --check "$P"
          git -C "$W" apply --reverse "$P"
      - name: Build the kernel
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --only kernel 2>&1 | tee "$RUNNER_TEMP/kernel-2.log"
      - name: Archive logs on failure
        if: failure()
        run: |
          set +e
          for f in UniXNU/out/droidvm/logs/*.log UniXNU/out/droidvm/build-all/logs/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            grep -E "error:|undefined|referenced from" "$f" | head -20
          done
      - name: Self-check
        if: always()
        run: |
          set +e
          K=UniXNU/out/droidvm/kernel/kernel.macho
          ls -l "$K" || { echo "::error::no kernel built"; exit 1; }
          echo "probe ticks:  $(strings "$K" | grep -c 'droidvm_probe_base_swap_ticks')"
          echo "probe ptr:    $(strings "$K" | grep -c 'droidvm_probe_base_swap_ptr')"
          echo "pipeline:     $(strings "$K" | grep -c 'droidvm_virtio_present_pipeline')"
      - name: Keep the built kernel as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-macho-${{ github.run_id }}
          path: UniXNU/out/droidvm/kernel/kernel.macho
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Publish the kernel as a release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          K=UniXNU/out/droidvm/kernel/kernel.macho
          TAG="kernel-$(date -u +%Y%m%d)-r${RUN_ID}"
          sum=$(shasum -a 256 "$K" | awk '{print $1}')
          printf '%s  kernel.macho\n' "$sum" > "$RUNNER_TEMP/kernel.macho.sha256"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "run ${RUN_ID} sha256 ${sum}" \
            "$K" "$RUNNER_TEMP/kernel.macho.sha256" \
            || gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$K" "$RUNNER_TEMP/kernel.macho.sha256"
