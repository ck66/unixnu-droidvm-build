name: build kernel (guest)

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        default: 56023cdc363249d201328e9e147f7b05690eba4e
      device_ref:
        default: b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13
  push:
    paths:
      - 'trigger-kernel/**'

permissions:
  contents: write

env:
  BOARD: droidvm
  UNIXNU_REF: ${{ inputs.unixnu_ref || '56023cdc363249d201328e9e147f7b05690eba4e' }}
  DEVICE_REF: ${{ inputs.device_ref || 'b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13' }}
  DATA_VOLUME_UUID: C9B8D4FB-631D-44C4-90AA-35C392D4B8E5
  GITHUB_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/macOS-DroidVM
          ref: main
          path: ci
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
          brew install llvm dtc mtools gnu-sed pkg-config meson bison flex xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          df -h /

      - name: Apply the overlay
        run: |
          set -euo pipefail
          mkdir -p UniXNU-droidvm/patches/xnu UniXNU-droidvm/drivers
          cp ci/overlay/$BOARD/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R ci/overlay/$BOARD/drivers/. UniXNU-droidvm/drivers/
          cp -R ci/overlay/$BOARD/scripts/. UniXNU-droidvm/scripts/
          cp -n UniXNU/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/ || true
          cp -R UniXNU-droidvm device-ref
          python3 ci/scripts/make-reference-device.py device-ref "${BOARD}_defconfig"
          python3 ci/scripts/apply-overlay-board.py UniXNU-droidvm "${BOARD}_defconfig"

      # MEASURED 2026-11-16 on the phone: the component revision pinned by this
      # UniXNU ref (GopFramebuffer 19ef3a75, 2026-10-30) predates the display
      # version that publishes the display attributes / IOMFBUUID / NativeDisplayEDID
      # and attaches the IODisplay (54bd1cf6 and later).  The built kernel has no
      # attachDisplayObject / announcePoweredByFirmware / NativeDisplayEDID symbol
      # and no IOMFBUUID string at all, so the guest boots with "Current Display"
      # empty, backboardd's IOMFB client gets kIOReturnUnsupported for 12 selectors,
      # its one swap never completes and the compositor never presents.  Bump that
      # one pin; every other component stays exactly as pinned.
      - name: Bump the display component to the display-attribute revision
        env:
          GOP_REV: b0d812d578efa2acb005b66f73168891719af09a
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          rev = os.environ['GOP_REV']
          hits = 0
          for name in ('UniXNU/components.toml', 'device-ref/components.toml', 'UniXNU-droidvm/components.toml'):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              new, n = re.subn(r'([Rr]evision\s*=\s*")[0-9a-f]{40}(")',
                               lambda m: m.group(1) + rev + m.group(2), text)
              if n:
                  text = re.sub(r'(id\s*=\s*"GopFramebuffer"(?:(?!\[\[component\]\])[\s\S])*?revision\s*=\s*")[0-9a-f]{40}(")',
                                lambda m: m.group(1) + rev + m.group(2), text, count=1)
                  path.write_text(text)
                  hits += 1
                  print(name, 'updated')
          if hits == 0:
              raise SystemExit('no components.toml with a GopFramebuffer pin was found')
          for name in ('UniXNU/components.toml', 'device-ref/components.toml'):
              path = pathlib.Path(name)
              if path.exists():
                  block = path.read_text().split('id = "GopFramebuffer"')[1][:600]
                  line = [l for l in block.splitlines() if 'revision' in l][:1]
                  print(name, line)
          PY

      - name: Build the reference candidate
        working-directory: UniXNU
        run: |
          set -o pipefail
          ./unixnu defconfig "${BOARD}_defconfig" -D ../device-ref 2>&1 | tee "$RUNNER_TEMP/ref.log"
          ./unixnu fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu ipsw fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu build kernel -j "$(sysctl -n hw.ncpu)" 2>&1 | tee "$RUNNER_TEMP/ref-kernel.log"
          mkdir -p "$RUNNER_TEMP/ref"
          cp "out/$BOARD/kernel/kernel.macho" "out/$BOARD/kernel/kernel.json" "$RUNNER_TEMP/ref/"
          ls -l "$RUNNER_TEMP/ref"
          echo "reference candidate: $(wc -c < "$RUNNER_TEMP/ref/kernel.macho") bytes"

      - name: Sources, volumes, policies, Data fixture
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --to data-base 2>&1 | tee "$RUNNER_TEMP/kernel-1.log"
          df -h /

      - name: Pin the Data volume UUID
        run: |
          set -euo pipefail
          seed=UniXNU/out/droidvm/tree/build/owner-data-fixture/seed.json
          ls -l "$seed"
          python3 - "$seed" "$DATA_VOLUME_UUID" <<'PY'
          import json, sys
          path, uuid = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          print('fixture uuid', data.get('volume_uuid'), '->', uuid)
          data['volume_uuid'] = uuid
          json.dump(data, open(path, 'w'), indent=2)
          PY

      - name: Place the reference candidate in the tree
        run: |
          set -euo pipefail
          for ref in "UniXNU/out/droidvm/tree/build/reference-candidate" \
                     "UniXNU-droidvm/out/droidvm/tree/build/reference-candidate"; do
            mkdir -p "$ref"
            cp "$RUNNER_TEMP/ref/kernel.macho" "$RUNNER_TEMP/ref/kernel.json" "$ref/"
            echo "== $ref"; ls -l "$ref"
          done

      - name: Turn this repository's XNU changes into a patch
        run: |
          set -euo pipefail
          W=UniXNU/out/droidvm/tree/.cache/xnu-work
          P="$GITHUB_WORKSPACE/UniXNU/out/droidvm/tree/patches/xnu/zzzz-droidvm-hole-and-diag.patch"
          git -C "$W" add -A
          python3 self/scripts/apply-xnu-changes.py "$W"
          git -C "$W" diff > "$P"
          git -C "$W" reset -q
          echo "--- the patch git produced ---"
          git apply --stat "$P" || { echo "::error::git cannot read the patch it just wrote"; exit 1; }
          git -C "$W" apply --reverse --check "$P"
          git -C "$W" apply --reverse "$P"
          echo "worktree reverted; the build applies $(basename "$P") itself"

      - name: Audit the patch and the source
        if: always()
        run: |
          set +e
          W=UniXNU/out/droidvm/tree/.cache/xnu-work
          P="$GITHUB_WORKSPACE/UniXNU/out/droidvm/tree/patches/xnu/zzzz-droidvm-hole-and-diag.patch"
          echo "=== the patch the build will apply ==="
          ls -l "$P" 2>/dev/null || echo missing
          git apply --stat "$P" 2>/dev/null
          echo "=== source markers, before the build applies it (expect 0) ==="
          echo "0001 comment:    $(grep -c 'DroidVM: the hole list is a hint' "$W/osfmk/vm/vm_map_store_rb.c" 2>/dev/null)"
          echo "0002 diagnostic: $(grep -c 'DroidVM owner-cache' "$W/bsd/kern/kern_exec.c" 2>/dev/null)"
          echo "=== the work tree ==="
          git -C "$W" log --oneline -1 2>/dev/null
          git -C "$W" status --short 2>/dev/null | wc -l

      - name: Build the kernel
        working-directory: UniXNU-droidvm
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --only kernel 2>&1 | tee "$RUNNER_TEMP/kernel-2.log"
          df -h /

      - name: Self-check
        if: success()
        run: |
          K=UniXNU/out/droidvm/kernel/kernel.macho
          ls -l "$K" || { echo "::error::no kernel built"; exit 1; }
          echo "data uuid strings: $(strings "$K" | grep -c "$DATA_VOLUME_UUID" || true)"
          echo "diagnostic marker: $(strings "$K" | grep -c 'DroidVM owner-cache' || true)"
          echo "display attach symbol: $(strings "$K" | grep -c 'attachDisplayObject' || true)"
          echo "display uuid property: $(strings "$K" | grep -c 'IOMFBUUID' || true)"
          df -h /

      - name: Keep the built kernel as an artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-macho-${{ github.run_id }}
          path: UniXNU/out/droidvm/kernel/kernel.macho
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Publish the kernel as a release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          K=UniXNU/out/droidvm/kernel/kernel.macho
          TAG="kernel-$(date -u +%Y%m%d)-r${RUN_ID}"
          sum=$(shasum -a 256 "$K" | awk '{print $1}')
          printf '%s  kernel.macho\n' "$sum" > "$RUNNER_TEMP/kernel.macho.sha256"
          notes="guest kernel.macho, $(date -u '+%F %T UTC'), run ${RUN_ID}, sha256 ${sum}"
          echo "tag=$TAG sha256=$sum"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" \
            "$K" "$RUNNER_TEMP/kernel.macho.sha256" \
            || gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
                 "$K" "$RUNNER_TEMP/kernel.macho.sha256"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) \(.url)"'
