# build-crosvm: the Droid-VM crosvm with the virtio-mmio transport, for Gunyah VMs on the phone.
#
# Why this exists: the UniXNU-droidvm payload (the iPadOS guest the sibling workflow builds)
# wants its disks, input, net, Data store and display on virtio-mmio. The DroidVM app's own
# crosvm is virtio-pci only -- `strings usr/bin/crosvm | grep -c virtio-mmio` = 0 on both the
# stable and the dev APK -- so a pseudo-unprotected VM boots the firmware, hands off to XNU and
# then sees no hardware at all: DarwinBoot prints "FDT devices: 0 disk(s), 0 input, 0 media" and
# not one byte is ever read from os.img (every fd stays at pos 0).
#
# The fork that has those devices is Droid-VM/crosvm branch wip/virtio-mmio, and it is built with
# AOSP's soong (its boot shim is a bare-metal crate that crosvm include_bytes!s, which soong
# cannot build -- so the shim goes first, with cargo).
#
# The unknown here is disk, not time: an AOSP tree for one module is 96 git projects including
# clang/rust prebuilts. So `stage: prepare` only syncs and reports the footprint, and `stage: full`
# continues into the build. Run prepare first; the report says what the tree actually costs.

name: build crosvm (virtio-mmio)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'prepare = sync + disk report only; full = sync + shim + build + collect'
        type: choice
        options: [prepare, full]
        default: prepare
      crosvm_ref:
        description: 'branch to check the Droid-VM forks out at (falls back to droidvm when a repo lacks it)'
        default: wip/virtio-mmio
      manifest_ref:
        description: 'branch of Droid-VM/crosvm-minimal-manifest'
        default: droidvm
      jobs:
        description: 'parallelism for repo sync and soong'
        default: '4'

env:
  MANIFEST_URL: https://github.com/Droid-VM/crosvm-minimal-manifest.git
  MANIFEST_FILE: crosvm-minimal.xml
  AOSP: ${{ github.workspace }}/aosp

defaults:
  run:
    shell: bash

jobs:
  crosvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: What we are building
        run: |
          echo "stage        ${{ inputs.stage }}"
          echo "crosvm ref   ${{ inputs.crosvm_ref }}"
          echo "manifest     $MANIFEST_URL @ ${{ inputs.manifest_ref }} ($MANIFEST_FILE)"
          echo "runner       $(uname -a)"
          df -h /

      # The runner ships ~14 GB free; an AOSP sync plus out/ does not fit in that. Everything
      # removed here is unused by this build: the tree brings its own clang/rust/jdk prebuilts,
      # so the runner's Android SDK, .NET, Haskell and cached toolchains are dead weight.
      - name: Reclaim the runner's disk
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl wget unzip zip xz-utils rsync cpio \
            bison flex gperf libxml2-utils zlib1g-dev libssl-dev \
            python3 python3-venv \
            binutils-aarch64-linux-gnu
          df -h /

      # The shim is a bare-metal crate with its own [toolchain]: stable plus the softfloat target
      # (not plain aarch64-unknown-none -- that one carries +neon, and SIMD in a pre-MMU shim is
      # an undefined-instruction trap in a VM with no console to say so).
      - name: Rust toolchain for the shim
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add aarch64-unknown-none-softfloat --toolchain stable
          rustc +stable --version
          cargo +stable --version

      - name: repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "crosvm build"
          git config --global user.email "build@localhost"
          git config --global color.ui false
          git config --global protocol.version 2
          "$HOME/bin/repo" --version

      # --depth 1: one commit per project, none of the history (the tree is 96 projects).
      # No --partial-clone: soong reads every source file, so lazy blobs would only trade disk
      # for a much slower build.
      - name: repo init
        run: |
          mkdir -p "$AOSP"
          cd "$AOSP"
          repo init -u "$MANIFEST_URL" -b "${{ inputs.manifest_ref }}" -m "$MANIFEST_FILE" --depth 1
          echo "--- manifest projects: $(grep -c '<project' .repo/manifests/$MANIFEST_FILE)"
          du -sh .repo

      # -c: current branch only; --no-tags: the trees have no use for tags; --force-sync so a
      # re-run repairs a half-finished sync instead of tripping over it.
      - name: repo sync
        run: |
          cd "$AOSP"
          time repo sync -c -j"${{ inputs.jobs }}" --no-tags --force-sync --optimized-fetch
          df -h /
          du -sh "$AOSP"

      - name: Disk report after the sync
        if: always()
        run: |
          echo "=== df ==="; df -h /
          echo "=== top-level sizes ==="
          du -sh "$AOSP"/* 2>/dev/null | sort -rh | head -20 || true
          echo "=== prebuilts (the heavy part) ==="
          du -sh "$AOSP"/prebuilts/* 2>/dev/null | sort -rh | head -10 || true
          df -h /

      # Branch chain, the way droidvm-meta-repo/lib_branch.sh resolves it: the work's branch
      # first, the org's stable branch second, the manifest revision if neither exists. Only the
      # forks that carry the mmio work move; the rest stay on droidvm.
      - name: Check the Droid-VM forks out at the working branch
        run: |
          set -euo pipefail
          cd "$AOSP"
          want="${{ inputs.crosvm_ref }}"
          for pair in "external/crosvm:crosvm" "hardware/google/gfxstream:gfxstream" \
                      "external/virglrenderer:virglrenderer" "packages/modules/Virtualization:Virtualization" \
                      "external/libvncserver:libvncserver" "external/zstd:zstd"; do
            dir=${pair%%:*}; name=${pair##*:}
            url="https://github.com/Droid-VM/$name.git"
            b=""
            for candidate in "$want" droidvm; do
              if git ls-remote --exit-code --heads "$url" "refs/heads/$candidate" >/dev/null 2>&1; then
                b=$candidate; break
              fi
            done
            if [ -z "$b" ]; then
              echo ">>> $dir: neither $want nor droidvm on $url -- keeping $(git -C "$dir" rev-parse --short HEAD)"
              continue
            fi
            git -C "$dir" fetch -q "$url" "$b"
            git -C "$dir" checkout -q -B "$b" FETCH_HEAD
            echo ">>> $dir @ $b $(git -C "$dir" rev-parse --short HEAD)"
          done
          echo "=== the crosvm tree we are about to build ==="
          git -C external/crosvm log --oneline -3

      - name: Stop here (stage=prepare)
        if: inputs.stage == 'prepare'
        run: |
          echo "sync only: the crosvm build was not started (stage=prepare)."
          df -h /

      # crosvm include_bytes!s the shim, so it has to exist before soong compiles the tree.
      - name: Build the boot shim
        if: inputs.stage == 'full'
        run: bash "${{ github.workspace }}/scripts/build_shim.sh" "$AOSP"

      - name: Build crosvm_device_only
        if: inputs.stage == 'full'
        run: |
          set -o pipefail
          cd "$AOSP"
          source build/envsetup.sh
          lunch aosp_arm64 trunk_staging eng || lunch aosp_arm64-trunk_staging-eng
          df -h /
          time ALLOW_MISSING_DEPENDENCIES=true TARGET_BUILD_UNBUNDLED=true \
            m crosvm_device_only -j"${{ inputs.jobs }}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          df -h /

      - name: Collect crosvm and the libraries it links
        if: inputs.stage == 'full'
        run: |
          set -o pipefail
          cd "$AOSP"
          bash "${{ github.workspace }}/scripts/collect_crosvm.sh" "${{ github.workspace }}/dist"
          echo "=== self-check: the binary must know virtio-mmio ==="
          n=$(strings "${{ github.workspace }}/dist/crosvm" | grep -c "virtio-mmio" || true)
          echo "virtio-mmio strings: $n"
          [ "$n" -gt 0 ] || { echo "::error::the built crosvm has no virtio-mmio in it"; exit 1; }
          ls -l "${{ github.workspace }}/dist"
          du -sh "${{ github.workspace }}/dist"

      - name: Package
        if: inputs.stage == 'full'
        run: |
          cd "${{ github.workspace }}/dist"
          {
            echo "built      $(date -u '+%F %T UTC')"
            echo "run        ${{ github.run_id }}"
            echo "crosvm ref ${{ inputs.crosvm_ref }}"
            for pair in "crosvm:external/crosvm" "gfxstream:hardware/google/gfxstream" \
                        "virglrenderer:external/virglrenderer" "Virtualization:packages/modules/Virtualization" \
                        "libvncserver:external/libvncserver" "zstd:external/zstd"; do
              name=${pair%%:*}; dir=${pair##*:}
              echo "$name $(git -C "$AOSP/$dir" rev-parse HEAD) $(git -C "$AOSP/$dir" rev-parse --abbrev-ref HEAD)"
            done
          } > MANIFEST.txt
          cat MANIFEST.txt
          sha256sum crosvm > crosvm.sha256
          tar czf "$GITHUB_WORKSPACE/crosvm-mmio-${{ github.run_id }}.tar.gz" .
          ls -lh "$GITHUB_WORKSPACE/crosvm-mmio-${{ github.run_id }}.tar.gz"

      - name: Upload the build
        if: inputs.stage == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-mmio-${{ github.run_id }}
          path: ${{ github.workspace }}/crosvm-mmio-${{ github.run_id }}.tar.gz
          compression-level: 0
          retention-days: 14

      - name: Upload the build log when it failed
        if: failure() && inputs.stage == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/build.log
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7
