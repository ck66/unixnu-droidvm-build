# Publish the firmware that build-edk2 produced into this repository.
#
# Why: an Actions artifact needs a token to download, and the machine that has to install the
# firmware on the phone has none. A file in a public repository can be fetched with plain https,
# so the build's output is committed here instead. `gh` can read the artifact of the triggering
# run with the repository's own GITHUB_TOKEN, so this stays inside the repo.

name: publish firmware to repo

on:
  workflow_run:
    workflows: ["build edk2-gunyah (firmware)"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the firmware from that run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "${{ github.repository }}" -D out || true
          found=$(find out -name 'edk2-gunyah.fd' | head -1)
          if [ -z "$found" ]; then
            echo "::error::no edk2-gunyah.fd in run $RUN_ID"
            find out -type f | head -20
            exit 1
          fi
          mkdir -p firmware
          dest="firmware/edk2-gunyah-$(date -u +%Y%m%d)-run${RUN_ID}.fd"
          cp "$found" "$dest"
          sha256sum "$dest" | tee "$dest.sha256"
          ls -l "$dest"

      - name: Commit it
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware
          git commit -m "firmware: edk2-gunyah from run ${{ github.event.workflow_run.id }}"
          git push
