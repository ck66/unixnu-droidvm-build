name: build kernel (ios16)

# First iOS 16 milestone: compile xnu-8796 for the droidvm guest, and stop there.
#
# No OS/SystemOS volume, no owner trust bundle, no payload: those need 7.7 GB of
# bvxn-wrapped dmgs and the cryptex/union chain, none of which can be debugged before
# a kernel exists.  This board's [ipsw] fetch asks for KernelCache + DeviceTree +
# StaticTrustCache only, so the run pulls ~18 MB instead of 6 GB.
#
# The board is derived from the working 17.7.11 board by boards/ios16/make-board.py,
# so every field that is *not* iOS 16 specific stays a field that is known to boot.
on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        default: 56023cdc363249d201328e9e147f7b05690eba4e
      device_ref:
        default: b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13
      whyred_ref:
        default: main
  push:
    paths:
      - 'trigger-kernel-ios16/**'
permissions:
  contents: write
env:
  BOARD: ios16
  # prepare-xnu-source.py restores DriverKit headers through the GitHub API, and anonymous
  # calls from a hosted runner are 403 rate limited (the script says so itself).
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  UNIXNU_REF: ${{ inputs.unixnu_ref || '56023cdc363249d201328e9e147f7b05690eba4e' }}
  DEVICE_REF: ${{ inputs.device_ref || 'b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13' }}
  WHYRED_REF: ${{ inputs.whyred_ref || 'main' }}
defaults:
  run:
    shell: bash
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: N1709/UniXNU-whyred
          ref: ${{ env.WHYRED_REF }}
          path: whyred
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          set -euo pipefail
          brew install llvm dtc mtools gnu-sed pkg-config meson bison flex xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Install the iOS 16 board
        run: |
          set -euo pipefail
          python3 self/boards/ios16/make-board.py UniXNU-droidvm
          cp self/boards/ios16/configs/ios16_defconfig UniXNU-droidvm/configs/ios16_defconfig
          # The resolver applies one patch at a time and aborts on the first refusal; 8796
          # needs a shorter context for several of them. boards/ios16/patch-resolver.py teaches
          # it to retry with -C1/-C0 and prints the selected list plus which patch needed that.
          python3 self/boards/ios16/patch-resolver.py UniXNU | tee "$RUNNER_TEMP/patch-resolver.log"
          echo '--- ios16_defconfig ---'
          cat UniXNU-droidvm/configs/ios16_defconfig
      - name: Vendor the display audit
        run: |
          set -euo pipefail
          # build-native-legacy-display.py calls scripts/audit-mobile-graphics-legacy.py to read
          # the original IOMobileGraphicsFamily leaves out of the prelinked kernel, and the
          # device repository does not carry that file (display was never built for droidvm
          # before).  The kernel does contain the family (IOMobileFramebuffer/IOMobileGraphicsFamily
          # are in the prelink), so the audit has its reference; only the script was missing.
          cp self/boards/ios16/vendor/audit-mobile-graphics-legacy.py UniXNU-droidvm/scripts/
          ls -l UniXNU-droidvm/scripts/audit-mobile-graphics-legacy.py

      - name: Swap in the iOS 16 kernel patches
        run: |
          set -euo pipefail
          rm -rf UniXNU-droidvm/patches/xnu
          mkdir -p UniXNU-droidvm/patches/xnu
          cp whyred/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/
          # whyred's series carries its own 8796 source-machine-layer, so nothing is replaced
          # here; the board.toml now points patch_series at that list alone.  The owner-root
          # patches and the verified-block shims are ours: whyred ships the SystemOS mount but
          # not the two bsd_init.c pieces it depends on, and its extern declarations had no
          # implementation anywhere in this build.  build-xnu-4k-baseline.sh applies every
          # patches/xnu/*.patch, so a file here is enough -- no series change is needed.
          cp self/boards/ios16/patches/xnu-owner/*.patch UniXNU-droidvm/patches/xnu/
          echo "device patches from whyred @ $(git -C whyred rev-parse --short HEAD) + owner: $(ls UniXNU-droidvm/patches/xnu | wc -l)"
      - name: Point the xnu source at 8796 (device-level feed override)
        run: |
          set -euo pipefail
          cat >> UniXNU-droidvm/feeds.toml <<'FEEDEOF'

          # iOS 16: the arch layer's own feeds.toml pins xnu-10063.141.1 and states that
          # "everything that depends on the Darwin version is set here". A device may add its own
          # feeds, so the same source name is declared again with the 20H392 revision. If the
          # resolver keeps the first definition, `unixnu fetch` still pulls 10063 and the build
          # step prints the tree's commit, so the log says which one we got.
          [[source]]
          name = "xnu"
          kind = "refer"
          git = "https://github.com/apple-oss-distributions/xnu.git"
          ref = "xnu-8796.141.3"
          commit = "1b191cb58250d0705d8a51287127505aa4bc0789"
          darwin = "22.6.0"
          version = "8796.141.3"
          driverkit_tag = "xnu-8796.101.5"
          trustcache_tag = "xnu-8796.101.5"
          FEEDEOF
          tail -14 UniXNU-droidvm/feeds.toml
      - name: Seed the display audit reference
        env:
          DISPLAY_REF_RUN: "45924742593"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # build-native-legacy-display.py runs before the kernel is linked, and its audit needs
          # a prelink plan (kernel.macho + kernel.json) of a kernel that carries the original
          # IOMobileGraphicsFamily executable.  A fresh runner has none -- the archives run
          # first, so out/$BOARD/kernel does not exist yet -- and the script then symlinks a
          # dangling reference.  Stage the last good kernel run instead and point the builder at
          # it; every later build of this board carries the same unchanged original family.
          DIR="$RUNNER_TEMP/display-reference"
          mkdir -p "$DIR"
          gh run download "$DISPLAY_REF_RUN" --repo "$GITHUB_REPOSITORY" --name ios16-kernel --dir "$DIR"
          ls -l "$DIR/kernel"
          python3 - "$DIR/kernel" <<'PY'
          import sys
          from pathlib import Path
          script = Path('UniXNU-droidvm/scripts/build-native-legacy-display.py')
          text = script.read_text()
          old = "    reference=ROOT/'build/reference-candidate'/('kernel'+suffix)"
          new = "    reference=Path(%r)/('kernel'+suffix)" % sys.argv[1]
          if old not in text:
              raise SystemExit('reference anchor missing in %s' % script)
          script.write_text(text.replace(old, new, 1))
          print('display audit reference ->', sys.argv[1])
          PY

      - name: Build the kernel
        working-directory: UniXNU
        run: |
          set -o pipefail
          # The fetched xnu lives here; `unixnu fetch` creates it, so this is only a path.
          W="out/$BOARD/tree/.cache/xnu-work"
          # A bare grep in a pipefail step aborts the whole run when it matches nothing (run 10
          # died exactly there, with an almost empty log).
          {
            echo "--- what the resolver says about xnu ---"
            grep -E "^(ref|commit|version|darwin|driverkit_tag|trustcache_tag)" UniXNU-droidvm/feeds.toml | tail -8
          } | tee -a "$RUNNER_TEMP/ios16.log" || true
          ./unixnu defconfig ios16_defconfig -D ../UniXNU-droidvm 2>&1 | tee -a "$RUNNER_TEMP/ios16.log"
          ./unixnu fetch 2>&1 | tee -a "$RUNNER_TEMP/ios16.log"
          echo "xnu tree commit: $(git -C "$W" rev-parse --short HEAD 2>/dev/null || echo 'not a git tree')" | tee -a "$RUNNER_TEMP/ios16.log"
          echo "xnu version: $(sed -n 's/.*RC_ProjectSourceVersion=\(.*\)/\1/p' "$W"/config/MASTER 2>/dev/null | head -1)" | tee -a "$RUNNER_TEMP/ios16.log"
          # whyred's series was written against its own xnu tree; on 8796 a few patches refuse
          # (a file the arch layer already provides, or context that moved).  Make the patch loop
          # tolerant so one run reports every one of them instead of stopping at the first, and
          # name each skip in the log.
          # The last-resort source fixups (see boards/ios16/fixup-8796.py) must sit next to
          # build-xnu-4k-baseline.sh, which is executed from out/$BOARD/tree.
          mkdir -p "out/$BOARD/tree/scripts"
          cp ../self/boards/ios16/fixup-8796.py "out/$BOARD/tree/scripts/fixup-8796.py"
          cp ../self/boards/ios16/fixup-8796.py scripts/fixup-8796.py
          # The archive list runs `build-virtio-archive.py`, and `unixnu build kernel` only
          # resolves archive scripts under <tree>/scripts -- same place the fixup already had
          # to be, so it is staged the same way.
          cp ../self/boards/ios16/build-virtio-archive.py "out/$BOARD/tree/scripts/build-virtio-archive.py"
          # The archive is bound before the kernel is linked, so the kext addresses can only
          # come from a previous run's measurement.  Absent, the script binds placeholders and
          # the "What came out" step measures instead.
          if [ -f ../self/boards/ios16/virtio-record.json ]; then
            cp ../self/boards/ios16/virtio-record.json "out/$BOARD/tree/scripts/virtio-record.json"
            echo "virtio record: $(wc -c < ../self/boards/ios16/virtio-record.json) bytes"
          else
            echo "virtio record: none, this run measures"
          fi
          python3 - <<'PYEOF' 2>&1 | tee -a "$RUNNER_TEMP/ios16.log"
          from pathlib import Path
          old = ('    git -C .cache/xnu-work apply --check "$PATCH"\n'
                 '    git -C .cache/xnu-work apply "$PATCH"\n')
          new = ('    # 8796 moved some context; try less of it before giving up on a patch.\n'
                 '    applied=0\n'
                 '    for fuzz in "" "-C1" "-C0"; do\n'
                 '      if git -C .cache/xnu-work apply $fuzz --check "$PATCH"; then\n'
                 '        git -C .cache/xnu-work apply $fuzz "$PATCH" && applied=1 && break\n'
                 '      fi\n'
                 '    done\n'
                 '    if [ "$applied" = 0 ]; then\n'
                 '      echo "SKIP(does not apply to this xnu) $PATCH"\n'
                 '      continue\n'
                 '    fi\n')
          for script in (Path('scripts/build-xnu-4k-baseline.sh'),
                         Path('out/ios16/tree/scripts/build-xnu-4k-baseline.sh')):
              if not script.exists():
                  print('no', script); continue
              text = script.read_text()
              if new in text:
                  print('already tolerant:', script); continue
              if old not in text:
                  raise SystemExit('patch loop anchor missing in %s' % script)
              text = text.replace(old, new, 1)
              # The board has no VerifiedRoot kit: it needs a Darwin 23 reference candidate
              # that iOS 16 cannot produce (see ARCHIVES_NEW in make-board.py).  Keeping
              # XNU_VERIFIED_ROOT_PROBE on makes the script demand
              # build/verified-root-xnu/libVerifiedRootProbe.a and abort before prelink;
              # run71 linked a bare 18 MB xnu because of this.  The owner root audit is
              # backed by the IOKitBSDInit.cpp shims instead, so drop that hard dependency.
              audit_old = ('if [ "$OWNER_ROOT_AUDIT" = 1 ] && [ "$OWNER_ROOT_PROBE" != 1 ]; then\n'
                           "  echo 'The root-binding audit requires real owner-verified block crypto' >&2\n"
                           '  exit 1\n'
                           'fi\n')
              if audit_old in text:
                  text = text.replace(audit_old,
                      '# ios16: owner-root audit is backed by the DroidVM shims, no VerifiedRoot archive.\n', 1)
                  print('owner-root audit dependency relaxed:', script)
              # xnu 8796 reads availability.pl from the SDK; the script already exports
              # XNU_AVAILABILITY_PL, so the tree's copy only needs the fallback that
              # UniXNU's local-availability.patch adds (and which cannot be applied here:
              # the fetched tree is a plain directory, and the patch is not in the series).
              avail_old = 'export XNU_AVAILABILITY_PL=$ROOT/.cache/fakeroot/usr/local/libexec/availability.pl\n'
              avail_new = (avail_old +
                "sed -i '' 's|^AVAILABILITY_PL=\"${SDKROOT}/${DRIVERKITROOT}/usr/local/libexec/availability.pl\"$|"
                "AVAILABILITY_PL=\"${XNU_AVAILABILITY_PL:-${SDKROOT}/${DRIVERKITROOT}/usr/local/libexec/availability.pl}\"|' "
                ".cache/xnu-work/bsd/sys/make_symbol_aliasing.sh\n")
              if avail_old in text and 'AVAILABILITY_PL=\"${XNU_AVAILABILITY_PL' not in text:
                  text = text.replace(avail_old, avail_new, 1)
                  print('availability fallback injected:', script)
              # 8796 has two `bool reserved10;` in osfmk/arm/pmap/pmap.h (one behind
              # CONFIG_ROSETTA, one behind HAS_APPLE_PAC). With both features off -- which is
              # this board -- the struct has a duplicate member and nothing compiles.
              # non-apple-pmap-field.patch fixes the 10063 numbering, not 8796's, so a small
              # helper (staged next to this script) renames the later field.
              # installhdrs re-creates the SDK fakeroot and the compile reads EXPORT_HDRS, so
              # the private firehose header has to be placed again right before the build make.
              late = 'make -C .cache/xnu-work "${XNU_BUILD_TARGET:-build}"'
              if late in text and 'fixup-8796.py --late' not in text:
                  text = text.replace(late, 'python3 scripts/fixup-8796.py --late\n' + late, 1)
                  print('late fixup injected:', script)
              if '# 8796 fixups' not in text:
                  text = text.replace(avail_new, avail_new + 'python3 scripts/fixup-8796.py  # 8796 fixups\n', 1)
                  print('8796 fixups injected:', script)
              script.write_text(text)
              print('tolerant patch loop:', script)
          PYEOF
          # xnu 8796's build looks for availability.pl inside the SDK (10063 reads it from
          # XNU_AVAILABILITY_PL instead), and UniXNU's own local-availability.patch is what
          # switches it over. Applying it up front keeps the patch loop's reverse-check happy.
          ./unixnu ipsw fetch 2>&1 | tee -a "$RUNNER_TEMP/ios16.log"
          ./unixnu build kernel -j "$(sysctl -n hw.ncpu)" 2>&1 | tee -a "$RUNNER_TEMP/ios16.log"
      - name: What came out
        if: always()
        run: |
          set +e
          # The kernel is linked before the archive step runs, so collect it even when the
          # archives fail -- that is the artifact this milestone is about.
          OBJ="UniXNU/out/$BOARD/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837"
          ls -l "$OBJ"/mach.* 2>/dev/null | head -8
          SRC=""
          for cand in "$OBJ/mach.development.bcm2837.unstripped.noctf" "$OBJ/mach.development.bcm2837.unstripped"; do
            if [ -f "$cand" ]; then SRC="$cand"; break; fi
          done
          DEST="UniXNU/out/$BOARD/kernel/kernel.macho"
          # The prelink step writes the artifact this milestone is about straight to $DEST, and the
          # plain copy below then replaced it with the raw linked xnu: run 44653449412 printed
          # sha f4ba0c86... for the prelinked image at 01:36:00 and shipped 08a9c1d8... (18,383,592
          # bytes, exactly the size of mach.*.unstripped) two seconds later.  Keep the prelinked
          # image whenever it exists, and put the raw xnu beside it under its own name so both are
          # inspectable in the artifact.
          if [ -s "$DEST" ]; then
            echo "keeping the prelinked kernel at $DEST"
          elif [ -n "$SRC" ]; then
            mkdir -p "UniXNU/out/$BOARD/kernel"
            cp "$SRC" "$DEST"
            echo "no prelinked kernel; collected $SRC -> $DEST"
          else
            echo "no linked kernel image found under $OBJ"
          fi
          [ -n "$SRC" ] && cp "$SRC" "UniXNU/out/$BOARD/kernel/kernel.xnu.macho"
          if [ -s "$DEST" ]; then
            # The virtio archive was bound to the kext addresses of a previous run (or to
            # placeholders when there was no record yet).  This image is the one that would boot:
            # verify the recorded addresses against it, or measure them from it.  The kexts only
            # exist in the prelinked image, so this reads $DEST, not the raw link output.
            TREE="UniXNU/out/$BOARD/tree"
            SCRIPT="$TREE/scripts/build-virtio-archive.py"
            echo "virtio: reading $DEST"
            if [ -f "$TREE/scripts/virtio-record.json" ]; then
              python3 "$SCRIPT" --verify "$DEST" "$TREE/scripts/virtio-record.json" \
                2>&1 | tee "$RUNNER_TEMP/virtio-verify.log" \
                || python3 "$SCRIPT" --measure "$DEST" --out "UniXNU/out/$BOARD/virtio-record.json" \
                     2>&1 | tee -a "$RUNNER_TEMP/virtio-verify.log"
            else
              python3 "$SCRIPT" --measure "$DEST" --out "UniXNU/out/$BOARD/virtio-record.json" \
                2>&1 | tee "$RUNNER_TEMP/virtio-verify.log"
            fi
          fi
          shasum -a 256 "UniXNU/out/$BOARD/kernel/"*.macho | tee "$RUNNER_TEMP/sha.txt"
          ls -l "UniXNU/out/$BOARD/kernel/" 2>/dev/null
      - name: Publish the last diagnostics into the status branch
        if: always()
        run: |
          set +e
          # The step output interleaves the parallel make, so the real compiler diagnostic is
          # read from the build's own log, with context, before anything else.
          {
            echo "run $GITHUB_RUN_ID"
            echo "--- first errors from kernel-bootstrap.log ---"
            LOG="UniXNU/out/$BOARD/logs/kernel-bootstrap.log"
            [ -f "$LOG" ] || LOG=$(ls UniXNU/out/*/logs/kernel-bootstrap.log 2>/dev/null | head -1)
            if [ -f "$LOG" ]; then
              # Only real diagnostics: "<path>:<line>:<col>: error: ..." (a plain "error:" also
              # matches string literals in IOLog format strings, which is what filled line up).
              PAT=':[0-9]+:[0-9]+: (fatal )?error:'
              grep -n -m 6 -E "$PAT|make\[[0-9]+\]: \*\*\* \[[^]]+\] Error [12]" "$LOG" | head -12
              N=$(grep -n -m 1 -E "$PAT" "$LOG" | cut -d: -f1)
              if [ -n "$N" ]; then sed -n "$((N>6 ? N-6 : 1)),$((N+12))p" "$LOG"; fi
            else
              echo "no $LOG"
            fi
            echo "--- link diagnostics ---"
            if [ -f "$LOG" ]; then
              grep -n -m 8 -E "^ld: |Undefined symbols|symbol\(s\) not found|duplicate symbol|_OBJC_CLASS_" "$LOG" | head -12
              M=$(grep -n -m 1 -E "Undefined symbols|symbol\(s\) not found" "$LOG" | cut -d: -f1)
              if [ -n "$M" ]; then sed -n "$M,$((M+40))p" "$LOG"; fi
            fi
            echo "--- compile records ---"
            R="UniXNU/out/$BOARD/tree/build/xnu/ios-obj"
            find "$R" -name "IOPlatformExpert.cpo.json" 2>/dev/null | head -2
            echo "records: $(find "$R" -name '*.json' 2>/dev/null | wc -l)  objects: $(find "$R" -name '*.cpo' 2>/dev/null | wc -l)"
            find "$R" -name '*.json' 2>/dev/null | head -3
            ls "UniXNU/out/$BOARD/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit" 2>/dev/null | head -6
            echo "--- firehose kernel lib ---"
            T="UniXNU/out/$BOARD/tree"
            ls -l "$T/.cache/fakeroot/usr/local/lib/kernel" 2>/dev/null | head -8
            find "$T" -name "libfirehose*" -o -name "firehose_kernel*" 2>/dev/null | head -8
            grep -n -E "libfirehose_kernel|BUILD SUCCEEDED|BUILD FAILED" "$LOG" 2>/dev/null | tail -6
            echo "--- archive diagnostics ---"
            # build-libpthread-kernel.py writes the full clang output to
            # build/libpthread-kernel/<name>.log but only rethrows its last 4500 chars, so the
            # real error can be absent from out/<board>/logs/archive-*.log. Scan both.
            for A in $(ls -t UniXNU/out/$BOARD/logs/archive-*.log \
                          UniXNU/out/$BOARD/tree/build/*/*.log 2>/dev/null | head -8); do
              if grep -qE ':[0-9]+:[0-9]+: (fatal )?error:' "$A"; then
                echo "file: $(basename "$A")"
                grep -n -E ':[0-9]+:[0-9]+: (fatal )?error:' "$A" | head -5
                K=$(grep -n -m 1 -E ':[0-9]+:[0-9]+: (fatal )?error:' "$A" | cut -d: -f1)
                sed -n "$((K>8 ? K-8 : 1)),$((K+8))p" "$A"
                break
              fi
            done
            echo "--- virtio bindings ---"
            # What the archive step built and which kext addresses it baked (its stdout goes
            # into the build log), then the post-link opinion on whether they are still right.
            grep -E "^virtio:" "$RUNNER_TEMP/ios16.log" 2>/dev/null | head -60
            grep -h -E "^virtio:" UniXNU/out/$BOARD/logs/archive-*.log 2>/dev/null | sort -u | head -60
            [ -f "$RUNNER_TEMP/virtio-verify.log" ] && cat "$RUNNER_TEMP/virtio-verify.log"
            echo "--- fixups ---"
            grep -E "^fixup:|^late:" "$LOG" 2>/dev/null | head -12
            echo "--- step log ---"
            grep -E "xnu tree commit|patches:|XNU patch|resolver" "$RUNNER_TEMP/ios16.log" | head -20
            echo "--- tail ---"
            tail -20 "$RUNNER_TEMP/ios16.log"
          } > self/status/ios16-last.txt
          cp self/status/ios16-last.txt "self/status/ios16-$GITHUB_RUN_ID.txt"
          # A commit on display-bump raced the trigger commits and left every later run reading
          # the first run's file. The diagnostics go to their own branch instead, force-pushed:
          # nothing else writes it, so there is nothing to race with.
          git -C self config user.email "action@users.noreply.github.com"
          git -C self config user.name "ios16 build"
          git -C self checkout -q -B ios16-status
          git -C self add status/
          git -C self commit -m "status: ios16 run $GITHUB_RUN_ID" || true
          git -C self push --force origin ios16-status || true
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios16-kernel-logs
          path: |
            ${{ runner.temp }}/ios16.log
            ${{ runner.temp }}/sha.txt
            ${{ runner.temp }}/virtio-verify.log
            UniXNU/out/${{ env.BOARD }}/logs/*.log
          if-no-files-found: warn
      - name: Keep the kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios16-kernel
          path: |
            UniXNU/out/${{ env.BOARD }}/kernel/kernel.macho
            UniXNU/out/${{ env.BOARD }}/kernel/kernel.xnu.macho
            UniXNU/out/${{ env.BOARD }}/kernel/kernel.json
            UniXNU/out/${{ env.BOARD }}/virtio-record.json
          if-no-files-found: warn
