name: build data seed (ios16)

# The Data volume of the iOS 16 guest: a packed APFS container (DBRDISK1) holding the OS
# volume's own /private/var, which DarwinBoot hands over as the packed ram disk and the
# guest's apfs mounts at /private/var.  It cannot be made anywhere but on macOS (hdiutil +
# newfs_apfs), which is why it lives here and not on the build PC.
#
# Only the seed chain runs: no kernel, no patches, no owner trust bundle.  The 17.7.11
# chain's last step (add-app-cryptex-data.py) is intentionally absent -- it pins the
# 21H461 cryptex and stages it for the droidvm owner layer, neither of which exists on
# this board yet; Safari's daemons can fail without stopping the boot to SpringBoard.
on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        default: 56023cdc363249d201328e9e147f7b05690eba4e
      device_ref:
        default: b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13
      grow_gib:
        default: "2"
  push:
    paths:
      - 'trigger-data-ios16/**'
permissions:
  contents: write
env:
  BOARD: ios16
  UNIXNU_REF: ${{ inputs.unixnu_ref || '56023cdc363249d201328e9e147f7b05690eba4e' }}
  DEVICE_REF: ${{ inputs.device_ref || 'b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13' }}
  GROW_GIB: ${{ inputs.grow_gib || '2' }}
defaults:
  run:
    shell: bash
jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the iOS 16 board
        run: |
          set -euo pipefail
          python3 self/boards/ios16/make-board.py UniXNU-droidvm
          cp self/boards/ios16/configs/ios16_defconfig UniXNU-droidvm/configs/ios16_defconfig
          grep -n -E '^(url|product|version|build|device_class|chip_id|board_id|fetch) ' UniXNU-droidvm/board.toml | head -10
      - name: Fetch the OS volume
        working-directory: UniXNU
        run: |
          set -euo pipefail
          ./unixnu defconfig ios16_defconfig -D ../UniXNU-droidvm 2>&1 | tail -5
          ./unixnu ipsw fetch OS 2>&1 | tail -5
          ls -l out/ipsw/*/ || true
          df -h / | tail -1
      - name: Mount the OS volume read-only
        working-directory: UniXNU
        run: |
          set -euo pipefail
          DMG=$(ls out/ipsw/*/*.dmg | head -1)
          echo "dmg: $DMG ($(stat -f%z "$DMG") bytes)"
          MNT="$PWD/.cache/firmware/target-volumes/os-mount"
          rm -rf "$MNT"; mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -owners off -mountpoint "$MNT" "$DMG" || {
            echo "--- hdiutil attach failed, retrying as a raw disk image ---"
            hdiutil attach -imagekey diskimage-class=CRawDiskImage -readonly -nobrowse -owners off \
              -mountpoint "$MNT" "$DMG"
          }
          ls "$MNT" | head -20
          echo "--- launchd ---"
          ls -l "$MNT/sbin/launchd"
          echo "--- private/var ---"
          ls "$MNT/private/var" | head -20
          find "$MNT/private/var" -type f 2>/dev/null | wc -l
      - name: Make the Data seed
        working-directory: UniXNU
        run: |
          set -euo pipefail
          MNT="$PWD/.cache/firmware/target-volumes/os-mount"
          OUT="$PWD/out/data-seed"
          rm -rf "$OUT"; mkdir -p "$OUT"
          SHA=$(shasum -a 256 "$MNT/sbin/launchd" | cut -d' ' -f1)
          echo "launchd sha256 $SHA" | tee "$OUT/inputs.txt"
          echo "dmg sha256 $(shasum -a 256 $(ls out/ipsw/*/*.dmg | head -1) | cut -d' ' -f1)" | tee -a "$OUT/inputs.txt"
          python3 scripts/prepare-owner-data-fixture.py --output "$OUT/fixture" --launchd-sha256 "$SHA" \
            2>&1 | tee "$OUT/prepare.log"
          python3 - "$OUT" <<'PYEOF' 2>&1 | tee "$OUT/pack.log"
          import sys
          from pathlib import Path
          sys.path.insert(0, 'drivers/DarwinBoot/Test')
          import packed_ramdisk
          out = Path(sys.argv[1])
          print(packed_ramdisk.pack(out / 'fixture/owner-data-32.cdr', out / 'data-32.dbr'))
          PYEOF
          python3 scripts/seed-data-grow.py --volatile --gib "$GROW_GIB" "$OUT/data-32.dbr" "$OUT/data-2g.dbr" \
            2>&1 | tail -20
          sed -i '' "s/BUILD, VERSION = '21H461', '17.7.11'/BUILD, VERSION = '20H392', '16.7.16'/" \
            scripts/seed-data-skip-setup.py
          grep -n "^BUILD, VERSION" scripts/seed-data-skip-setup.py
          python3 scripts/seed-data-skip-setup.py "$OUT/data-2g.dbr" "$OUT/data-2g-skip.dbr" 2>&1 | tail -20
          ls -l "$OUT"/*.dbr
          cat "$OUT/fixture/seed.json"
      - name: What came out
        if: always()
        run: |
          set +e
          OUT=UniXNU/out/data-seed
          ls -l "$OUT" 2>/dev/null
          for f in "$OUT"/*.dbr; do
            [ -f "$f" ] || continue
            echo "$f: $(stat -f%z "$f") bytes head=$(head -c 8 "$f" | od -c | head -1)"
            shasum -a 256 "$f"
          done
          echo "--- volume uuid ---"
          python3 -c "import json;print(json.load(open('$OUT/fixture/seed.json'))['volume_uuid'])" 2>/dev/null
          hdiutil info | grep -E 'image-path|/dev/disk' | head -10
      - name: Publish the last diagnostics into the status branch
        if: always()
        run: |
          set +e
          mkdir -p self/status
          OUT=UniXNU/out/data-seed
          {
            echo "run $GITHUB_RUN_ID"
            echo "--- inputs ---"; cat "$OUT/inputs.txt" 2>/dev/null
            echo "--- prepare ---"; tail -40 "$OUT/prepare.log" 2>/dev/null
            echo "--- pack ---"; cat "$OUT/pack.log" 2>/dev/null
            echo "--- seed.json ---"; cat "$OUT/fixture/seed.json" 2>/dev/null
            echo "--- artefacts ---"; ls -l "$OUT" 2>/dev/null
            shasum -a 256 "$OUT"/*.dbr 2>/dev/null
          } > self/status/ios16-data-last.txt
          cp self/status/ios16-data-last.txt "self/status/ios16-data-$GITHUB_RUN_ID.txt"
          git -C self config user.email "action@users.noreply.github.com"
          git -C self config user.name "ios16 data seed"
          git -C self checkout -q -B ios16-status
          git -C self add status/
          git -C self commit -m "status: ios16 data run $GITHUB_RUN_ID" || true
          git -C self push --force origin ios16-status || true
      - name: Keep the seed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios16-data-seed
          path: |
            UniXNU/out/data-seed/*.dbr
            UniXNU/out/data-seed/fixture/seed.json
            UniXNU/out/data-seed/inputs.txt
            UniXNU/out/data-seed/*.log
          if-no-files-found: warn
