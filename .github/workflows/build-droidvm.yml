# build-droidvm: UniXNU-droidvm release set on a GitHub macOS runner
#
#   stage=kernel   list the droidvm build steps (temporary: the probe only inspects)
#   stage=full     fetch the OS/SystemOS volumes, build the whole release set.
#
# History of failures, kept because they are the whole reason this file looks like this:
#   * run 43194508321 / 43196953886  -- prepare-xnu-source.py hit 403 rate limit: needs GITHUB_TOKEN
#   * run 43201353668               -- `unixnu build kernel` links with 10 undefined `native_*`
#                                      symbols and audit-storage-interface-static.py wants a reference
#                                      kernel.macho that does not exist yet. board.toml says a build
#                                      from scratch must link such a kernel first and copy it to
#                                      build/reference-candidate/. That bootstrap is what
#                                      build-droidvm-all.py orchestrates, so calling `unixnu build
#                                      kernel` directly skips it.

name: build droidvm release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: kernel = list steps only; full = the whole release set
        type: choice
        options:
          - kernel
          - full
        default: kernel
      unixnu_ref:
        description: UniXNU ref (Droid-VM fork)
        default: wip/droidvm
      device_ref:
        description: UniXNU-droidvm ref
        default: wip/hackintosh
      xcode:
        description: Xcode on the image; empty = runner default
        default: ""
      unique_chip_id:
        description: 16 hex digits; only used by stage=full. Empty = use the secret.
        default: ""
      only:
        description: Optional --only STEP,... passed to build-droidvm-all.py
        default: ""
  push:
    paths:
      - "trigger/**"

permissions:
  contents: write

env:
  BOARD: droidvm
  IPSW_BUILD: "21H461"
  STAGE: ${{ github.event.inputs.stage || 'kernel' }}
  UNIXNU_REF: ${{ github.event.inputs.unixnu_ref || 'wip/droidvm' }}
  DEVICE_REF: ${{ github.event.inputs.device_ref || 'wip/hackintosh' }}
  XCODE: ${{ github.event.inputs.xcode || '' }}
  ONLY: ${{ github.event.inputs.only || '' }}
  GITHUB_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Check out UniXNU (Droid-VM fork)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pick Xcode and report the toolchain
        run: |
          if [ -n "$XCODE" ]; then sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"; fi
          echo "stage: $STAGE"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VER="$(xcodebuild -version | tr '\n' ' ')"
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null)"
          echo "::warning::toolchain | ${XCODE_VER}| iPhoneOS SDK ${SDK_VER} | macOS $(sw_vers -productVersion) $(uname -m) | stage=${STAGE}"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          MISSING=""
          for tool in cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild; do
            path="$(command -v "$tool" || true)"
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || MISSING="$MISSING $tool"
          done
          if [ -n "$MISSING" ]; then echo "::warning::missing host tools:$MISSING"; else echo "::warning::host tools OK"; fi

      - name: Cache the Apple source feed
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('UniXNU/feeds.toml', 'UniXNU-droidvm/feeds.toml') }}

      - name: Cache the extracted IPSW members
        uses: actions/cache@v4
        with:
          path: UniXNU/out/ipsw
          key: ipsw-${{ env.IPSW_BUILD }}

      - name: List the droidvm build steps (stage kernel)
        if: github.event.inputs.stage != 'full'
        working-directory: UniXNU-droidvm
        run: |
          python3 scripts/build-droidvm-all.py --list 2>&1 | tee "$RUNNER_TEMP/steps.log"

      - name: Introspect the device config (stage kernel)
        if: github.event.inputs.stage != 'full'
        working-directory: UniXNU
        run: |
          {
            echo "== ls UniXNU-droidvm/scripts"
            ls -1 ../UniXNU-droidvm/scripts | head -80
            echo "== board.toml [kernel] archives"
            sed -n '/^\[kernel\]/,/^\[/p' ../UniXNU-droidvm/board.toml | head -60
            echo "== reference-candidate references"
            grep -rn "reference-candidate" ../UniXNU-droidvm/scripts | head -20
          } 2>&1 | tee "$RUNNER_TEMP/introspect.log"

      # ---- stage=full only below this line ----

      - name: Resolve the chip id (stage full)
        id: chip
        if: github.event.inputs.stage == 'full'
        env:
          SECRET_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          INPUT_CHIP_ID: ${{ github.event.inputs.unique_chip_id || '' }}
        run: |
          chip="${INPUT_CHIP_ID:-$SECRET_CHIP_ID}"
          if [ -z "$chip" ]; then
            echo "::error::need a 16-hex-digit chip id: set the UNIXNU_UNIQUE_CHIP_ID secret or the input"
            exit 1
          fi
          if ! echo "$chip" | grep -Eq '^[0-9a-fA-F]{16}$'; then
            echo "::error::chip id must be exactly 16 hex digits"
            exit 1
          fi
          echo "::add-mask::$chip"
          echo "chip=$chip" >> "$GITHUB_OUTPUT"

      - name: Build the release set (stage full)
        if: github.event.inputs.stage == 'full'
        working-directory: UniXNU-droidvm
        env:
          CHIP: ${{ steps.chip.outputs.chip }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--unique-chip-id "$CHIP")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          echo "running: python3 scripts/build-droidvm-all.py ${args[*]}"
          python3 scripts/build-droidvm-all.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/full.log"

      - name: Show what came out
        if: always() && github.event.inputs.stage == 'full'
        working-directory: UniXNU-droidvm
        run: |
          for d in out/droidvm/release out/droidvm/build-all; do
            echo "== $d"
            ls -la "$d" 2>/dev/null || echo "(missing)"
          done
          if [ -d out/droidvm/release ]; then
            echo "::warning::stage full produced: $(ls out/droidvm/release | tr '\n' ' ')"
          else
            echo "::warning::stage full produced NO release directory"
          fi

      - name: Pack and encrypt
        id: pack
        if: always() && github.event.inputs.stage == 'full'
        working-directory: UniXNU-droidvm
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if [ ! -d out/droidvm/release ]; then
            echo "::error::out/droidvm/release missing -- the build did not reach the release step"
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/droidvm-release.tgz" -C out/droidvm release
          if [ -z "$ARTIFACT_KEY" ]; then
            echo "::error::ARTIFACT_KEY secret is not set; refusing to upload unencrypted Apple binaries"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/droidvm-release.tgz" -out "$RUNNER_TEMP/droidvm-release.tgz.enc"
          ls -lh "$RUNNER_TEMP/droidvm-release.tgz.enc"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Upload the encrypted release
        if: always() && steps.pack.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-release-enc
          path: ${{ runner.temp }}/droidvm-release.tgz.enc
          compression-level: 0
          retention-days: 7

      - name: Publish a run report into the repo
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/report.md"
          {
            echo "# run $RUN_ID"
            echo
            echo "- stage: $STAGE"
            echo "- refs: UniXNU@$UNIXNU_REF  device@$DEVICE_REF"
            echo
            echo "## toolchain"
            echo '```'
            sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
            echo '```'
            for f in "$RUNNER_TEMP/steps.log" "$RUNNER_TEMP/introspect.log"; do
              if [ -s "$f" ]; then
                echo "## $(basename "$f")"
                echo '```'
                cat "$f"
                echo '```'
              fi
            done
            echo "## verdict"
            echo '```'
            if [ -d "UniXNU/out/$BOARD/kernel" ] && [ -n "$(ls -A "UniXNU/out/$BOARD/kernel" 2>/dev/null)" ]; then
              echo "kernel OK: $(ls "UniXNU/out/$BOARD/kernel" | tr '\n' ' ')"
            else
              echo "kernel MISSING"
            fi
            du -sh "UniXNU/out/$BOARD" "UniXNU/out/ipsw" 2>/dev/null
            echo '```'
            echo "## error lines"
            echo '```'
            {
              grep -rIn -E "(^|[^a-z])error:|fatal error|FAILED|No such file|Undefined symbols|ld: symbol|Traceback" \
                UniXNU/out "$RUNNER_TEMP" --include=*.log 2>/dev/null \
                | grep -v '/feeds/' | grep -v 'compile.log:' | head -40
            } > "$RUNNER_TEMP/errs.txt" 2>&1
            if [ -s "$RUNNER_TEMP/errs.txt" ]; then cat "$RUNNER_TEMP/errs.txt"; else echo "(none)"; fi
            echo '```'
          } > "$OUT"
          echo "report is $(wc -c < "$OUT") bytes"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}" repo-status
          cd repo-status || exit 0
          mkdir -p status
          cp "$OUT" "status/run-${RUN_ID}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "status/run-${RUN_ID}.md"
          git commit -m "report for run ${RUN_ID}" || exit 0
          git push || echo "push failed"
