# build-droidvm: UniXNU-droidvm release set on a GitHub macOS runner
#
# Two stages, because the expensive part (the iPadOS system volumes, ~8 GiB of HTTP range
# reads) is only worth fetching once the cheap risk -- whether this Xcode can build XNU at
# all -- is cleared.
#
#   stage=kernel   fetch KernelCache only, build the kernel.   tens of MB, no secrets needed.
#   stage=full     fetch the OS/SystemOS volumes, build the whole release set.
#                  needs ARTIFACT_KEY and a 16-hex-digit chip id.
#
# Triggered two ways, and they mean the same thing:
#   * Run workflow (workflow_dispatch), stage chosen in the form
#   * a push touching trigger/ -- stage defaults to kernel
#
# The ::warning:: lines are deliberate. GitHub renders step annotations server-side, so a
# reader without a GitHub login (or without working DOM access to the Actions page) can still
# see the toolchain version and whether the stage produced anything. Keep them.

name: build droidvm release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: kernel = toolchain probe only; full = the whole release set
        type: choice
        options:
          - kernel
          - full
        default: kernel
      unixnu_ref:
        description: UniXNU ref (Droid-VM fork)
        default: wip/droidvm
      device_ref:
        description: UniXNU-droidvm ref
        default: wip/hackintosh
      xcode:
        description: Xcode on the image; empty = runner default
        default: ""
      unique_chip_id:
        description: 16 hex digits; only used by stage=full. Empty = use the secret.
        default: ""
      only:
        description: Optional --only STEP,... for a partial full run
        default: ""
  push:
    paths:
      - "trigger/**"

permissions:
  contents: read

env:
  BOARD: droidvm
  IPSW_BUILD: "21H461"
  STAGE: ${{ github.event.inputs.stage || 'kernel' }}
  UNIXNU_REF: ${{ github.event.inputs.unixnu_ref || 'wip/droidvm' }}
  DEVICE_REF: ${{ github.event.inputs.device_ref || 'wip/hackintosh' }}
  XCODE: ${{ github.event.inputs.xcode || '' }}
  ONLY: ${{ github.event.inputs.only || '' }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Check out UniXNU (Droid-VM fork)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pick Xcode and report the toolchain
        run: |
          if [ -n "$XCODE" ]; then sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"; fi
          echo "stage: $STAGE"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -f mig
          clang --version | head -n 1
          df -h "$GITHUB_WORKSPACE"
          XCODE_VER="$(xcodebuild -version | tr '\n' ' ')"
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null)"
          echo "::warning::toolchain | ${XCODE_VER}| iPhoneOS SDK ${SDK_VER} | macOS $(sw_vers -productVersion) $(uname -m) | stage=${STAGE}"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          MISSING=""
          for tool in cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild; do
            path="$(command -v "$tool" || true)"
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || MISSING="$MISSING $tool"
          done
          if [ -n "$MISSING" ]; then echo "::warning::missing host tools:$MISSING"; else echo "::warning::host tools OK"; fi

      - name: Cache the Apple source feed
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('UniXNU/feeds.toml', 'UniXNU-droidvm/feeds.toml') }}

      - name: Cache the extracted IPSW members
        uses: actions/cache@v4
        with:
          path: UniXNU/out/ipsw
          key: ipsw-${{ env.IPSW_BUILD }}

      - name: Configure (defconfig + feeds)
        working-directory: UniXNU
        run: |
          ./unixnu defconfig droidvm_defconfig -D ../UniXNU-droidvm
          ./unixnu fetch

      - name: Fetch KernelCache only (stage kernel)
        if: github.event.inputs.stage != 'full'
        working-directory: UniXNU
        run: |
          ./unixnu ipsw fetch KernelCache
          echo "::warning::KernelCache fetched: $(du -sh out/ipsw 2>/dev/null | cut -f1) in out/ipsw"

      - name: Build the kernel only (stage kernel)
        if: github.event.inputs.stage != 'full'
        working-directory: UniXNU
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          ./unixnu build kernel -j "$JOBS" || echo "first pass stopped as expected on a clean tree"
          ./unixnu build kernel -j "$JOBS"

      - name: Report what stage 1 produced
        if: always() && github.event.inputs.stage != 'full'
        working-directory: UniXNU
        run: |
          ls -la "out/$BOARD/kernel" 2>/dev/null || echo "(no kernel output)"
          du -sh "out/$BOARD" out/ipsw 2>/dev/null || true
          if ls "out/$BOARD/kernel"/* >/dev/null 2>&1; then
            echo "::warning::stage kernel produced: $(ls "out/$BOARD/kernel" | tr '\n' ' ')"
          else
            echo "::warning::stage kernel produced NOTHING in out/$BOARD/kernel"
          fi

      # ---- stage=full only below this line ----

      - name: Resolve the chip id (stage full)
        id: chip
        if: github.event.inputs.stage == 'full'
        env:
          SECRET_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          INPUT_CHIP_ID: ${{ github.event.inputs.unique_chip_id || '' }}
        run: |
          chip="${INPUT_CHIP_ID:-$SECRET_CHIP_ID}"
          if [ -z "$chip" ]; then
            echo "::error::need a 16-hex-digit chip id: set the UNIXNU_UNIQUE_CHIP_ID secret or the input"
            exit 1
          fi
          if ! echo "$chip" | grep -Eq '^[0-9a-fA-F]{16}$'; then
            echo "::error::chip id must be exactly 16 hex digits"
            exit 1
          fi
          echo "::add-mask::$chip"
          echo "chip=$chip" >> "$GITHUB_OUTPUT"

      - name: Build the release set (stage full)
        if: github.event.inputs.stage == 'full'
        working-directory: UniXNU-droidvm
        env:
          CHIP: ${{ steps.chip.outputs.chip }}
        run: |
          args=(--unique-chip-id "$CHIP")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          echo "running: python3 scripts/build-droidvm-all.py ${args[*]}"
          python3 scripts/build-droidvm-all.py "${args[@]}"

      - name: Show what came out
        if: always() && github.event.inputs.stage == 'full'
        working-directory: UniXNU-droidvm
        run: |
          for d in out/droidvm/release out/droidvm/build-all; do
            echo "== $d"
            ls -la "$d" 2>/dev/null || echo "(missing)"
          done
          du -sh out/droidvm out/ipsw 2>/dev/null || true
          if [ -d out/droidvm/release ]; then
            echo "::warning::stage full produced: $(ls out/droidvm/release | tr '\n' ' ')"
          else
            echo "::warning::stage full produced NO release directory"
          fi

      - name: Pack and encrypt
        id: pack
        if: always() && github.event.inputs.stage == 'full'
        working-directory: UniXNU-droidvm
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if [ ! -d out/droidvm/release ]; then
            echo "::error::out/droidvm/release missing -- the build did not reach the release step"
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/droidvm-release.tgz" -C out/droidvm release
          ls -lh "$RUNNER_TEMP/droidvm-release.tgz"
          if [ -z "$ARTIFACT_KEY" ]; then
            echo "::error::ARTIFACT_KEY secret is not set; refusing to upload unencrypted Apple binaries"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/droidvm-release.tgz" -out "$RUNNER_TEMP/droidvm-release.tgz.enc"
          ls -lh "$RUNNER_TEMP/droidvm-release.tgz.enc"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Upload the encrypted release
        if: always() && steps.pack.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-release-enc
          path: ${{ runner.temp }}/droidvm-release.tgz.enc
          compression-level: 0
          retention-days: 7

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-logs
          path: |
            UniXNU-droidvm/out/droidvm/**/logs/*.log
            UniXNU/out/**/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
