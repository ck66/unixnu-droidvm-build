# build-droidvm: UniXNU-droidvm release set on a GitHub macOS runner
#
# stage=kernel  introspect only (list steps, show config) -- cheap, no build
# stage=full    run build-droidvm-all.py for the whole release set
#
# Stage selection from a push: the commit message carries [full] for the full run.
#
# THE OVERLAY IS NOT OPTIONAL. Droid-VM/macOS-DroidVM carries overlay/droidvm/{patches,drivers,scripts};
# without copying it into the device checkout, `kernel` dies in the link with
#   "_native_adreno_fences", "_native_hid_pen_allocate", "_droidvm_page_info",
#   "_droidvm_gpu_sandbox_decides", "_droidvm_sensor_processor_register" ...
# referenced from libNativeLegacyDisplay.late.a (DroidVMGpu.o, HidInputProbe.o, DroidVMFileExport.o),
# because the device repository's own drivers are the older UniXNU ones. Run 43208533681 proved it:
# setup 719 s, volumes 16 s, policies 69 s, data-base 62 s, reference 414 s, kernel FAILED on the link.
#
# Reporting hooks (the Actions log API needs admin rights):
#   ::warning:: annotations, plus status/run-<id>.md committed back to the repo with full.log whole.

name: build droidvm release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: kernel = introspect only; full = the whole release set
        type: choice
        options:
          - kernel
          - full
        default: kernel
      unixnu_ref:
        description: UniXNU ref (Droid-VM fork)
        default: wip/droidvm
      device_ref:
        description: UniXNU-droidvm ref
        default: wip/hackintosh
      xcode:
        description: Xcode on the image; empty = runner default
        default: ""
      unique_chip_id:
        description: 16 hex digits; only used by stage=full
        default: ""
      only:
        description: Optional --only STEP,... passed to build-droidvm-all.py
        default: ""
  push:
    paths:
      - "trigger/**"

permissions:
  contents: write

env:
  BOARD: droidvm
  IPSW_BUILD: "21H461"
  STAGE: ${{ github.event.inputs.stage || (contains(github.event.head_commit.message, '[full]') && 'full' || 'kernel') }}
  UNIXNU_REF: ${{ github.event.inputs.unixnu_ref || 'wip/droidvm' }}
  DEVICE_REF: ${{ github.event.inputs.device_ref || 'wip/hackintosh' }}
  XCODE: ${{ github.event.inputs.xcode || '' }}
  ONLY: ${{ github.event.inputs.only || '' }}
  CHIP_DEFAULT: "0123456789abcdef"
  GITHUB_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Check out the ci harness (overlay + board scripts)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/macOS-DroidVM
          ref: main
          path: ci
          persist-credentials: false

      - name: Check out UniXNU (Droid-VM fork)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pick Xcode and report the toolchain
        run: |
          if [ -n "$XCODE" ]; then sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"; fi
          echo "stage: $STAGE"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VER="$(xcodebuild -version | tr '\n' ' ')"
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null)"
          echo "::warning::toolchain | ${XCODE_VER}| iPhoneOS SDK ${SDK_VER} | macOS $(sw_vers -productVersion) $(uname -m) | stage=${STAGE}"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          MISSING=""
          for tool in cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild; do
            path="$(command -v "$tool" || true)"
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || MISSING="$MISSING $tool"
          done
          if [ -n "$MISSING" ]; then echo "::warning::missing host tools:$MISSING"; else echo "::warning::host tools OK"; fi

      # Verbatim from Droid-VM/macOS-DroidVM mainline.yml, because the device repository on its own
      # links against drivers that do not define the symbols its own objects reference.
      - name: Apply the overlay into the device repository
        run: |
          mkdir -p UniXNU-droidvm/patches/xnu
          cp ci/overlay/$BOARD/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/
          mkdir -p UniXNU-droidvm/drivers
          cp -R ci/overlay/$BOARD/drivers/. UniXNU-droidvm/drivers/
          cp -R ci/overlay/$BOARD/scripts/. UniXNU-droidvm/scripts/
          cp -n UniXNU/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/
          python3 ci/scripts/apply-overlay-board.py UniXNU-droidvm "${BOARD}_defconfig" 2>&1 | tee "$RUNNER_TEMP/overlay.log"
          echo "--- overlay contents ---" | tee -a "$RUNNER_TEMP/overlay.log"
          ls ci/overlay/$BOARD/drivers | tee -a "$RUNNER_TEMP/overlay.log"
          echo "--- defconfig EXTRA_LD_ARCHIVES ---" | tee -a "$RUNNER_TEMP/overlay.log"
          grep -n 'EXTRA_LD_ARCHIVES' UniXNU-droidvm/configs/${BOARD}_defconfig | tee -a "$RUNNER_TEMP/overlay.log"
          echo "::warning::overlay applied: $(grep -c . "$RUNNER_TEMP/overlay.log") lines of log"

      - name: Cache the Apple source feed
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('UniXNU/feeds.toml', 'UniXNU-droidvm/feeds.toml') }}

      - name: Cache the extracted IPSW members
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/ipsw
            UniXNU/out-reference/ipsw
          key: ipsw-${{ env.IPSW_BUILD }}

      - name: Introspect (stage kernel)
        if: env.STAGE == 'kernel'
        working-directory: UniXNU-droidvm
        run: |
          python3 scripts/build-droidvm-all.py --list 2>&1 | tee "$RUNNER_TEMP/steps.log"

      - name: Build the release set (stage full)
        if: env.STAGE == 'full'
        working-directory: UniXNU-droidvm
        env:
          SECRET_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          INPUT_CHIP_ID: ${{ github.event.inputs.unique_chip_id || '' }}
        run: |
          chip="${INPUT_CHIP_ID:-${SECRET_CHIP_ID:-$CHIP_DEFAULT}}"
          if ! echo "$chip" | grep -Eq '^[0-9a-fA-F]{16}$'; then
            echo "::error::chip id must be exactly 16 hex digits, got '$chip'"
            exit 1
          fi
          echo "::add-mask::$chip"

          # step_reference builds into UniXNU/out-reference with its own `ipsw fetch`. Clone the members
          # already extracted into UniXNU/out/ipsw so the ~8 GiB is not paid twice.
          SRC="$(cd .. && pwd)/UniXNU/out/ipsw"
          DST="$(cd .. && pwd)/UniXNU/out-reference/ipsw"
          if [ -d "$SRC" ]; then
            for b in "$SRC"/*/; do
              [ -d "$b" ] || continue
              n="$(basename "$b")"
              mkdir -p "$DST/$n"
              for f in "$b"*; do
                [ -f "$f" ] || continue
                dest="$DST/$n/$(basename "$f")"
                [ -e "$dest" ] && continue
                cp -c "$f" "$dest" 2>/dev/null || cp "$f" "$dest"
              done
            done
            echo "pre-seeded $DST: $(du -sh "$DST" 2>/dev/null | cut -f1)"
          fi

          args=(--unique-chip-id "$chip")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -d "$SRC/$IPSW_BUILD" ]; then args+=(--ipsw-cache "$SRC/$IPSW_BUILD"); fi
          echo "running: python3 scripts/build-droidvm-all.py ${args[*]}"
          python3 scripts/build-droidvm-all.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/full.log"

      - name: Show what came out (stage full)
        if: always() && env.STAGE == 'full'
        working-directory: UniXNU-droidvm
        run: |
          for d in out/droidvm/release out/droidvm/build-all out/droidvm/tree/build/reference-candidate; do
            echo "== $d"
            ls -la "$d" 2>/dev/null || echo "(missing)"
          done
          if [ -d out/droidvm/release ]; then
            echo "::warning::stage full produced: $(ls out/droidvm/release | tr '\n' ' ')"
          else
            echo "::warning::stage full produced NO release directory"
          fi

      - name: Pack and encrypt (stage full)
        id: pack
        if: always() && env.STAGE == 'full'
        working-directory: UniXNU-droidvm
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if [ ! -d out/droidvm/release ]; then
            echo "::warning::no release directory to pack -- skipping the artifact"
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/droidvm-release.tgz" -C out/droidvm release
          ls -lh "$RUNNER_TEMP/droidvm-release.tgz"
          if [ -z "$ARTIFACT_KEY" ]; then
            echo "::error::ARTIFACT_KEY secret is not set; refusing to upload unencrypted Apple binaries"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/droidvm-release.tgz" -out "$RUNNER_TEMP/droidvm-release.tgz.enc"
          ls -lh "$RUNNER_TEMP/droidvm-release.tgz.enc"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Upload the encrypted release
        if: always() && steps.pack.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-release-enc
          path: ${{ runner.temp }}/droidvm-release.tgz.enc
          compression-level: 0
          retention-days: 7

      - name: Publish a run report into the repo
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/report.md"
          {
            echo "# run $RUN_ID"
            echo
            echo "- stage: $STAGE"
            echo "- refs: UniXNU@$UNIXNU_REF  device@$DEVICE_REF"
            echo
            echo "## toolchain"
            echo '```'
            sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
            echo '```'
            echo "## overlay"
            echo '```'
            cat "$RUNNER_TEMP/overlay.log" 2>/dev/null
            echo '```'
            echo "## full.log (whole)"
            echo '```'
            if [ -s "$RUNNER_TEMP/full.log" ]; then
              sz=$(wc -c < "$RUNNER_TEMP/full.log")
              echo "size: $sz bytes"
              if [ "$sz" -lt 250000 ]; then
                cat "$RUNNER_TEMP/full.log"
              else
                head -c 120000 "$RUNNER_TEMP/full.log"
                echo
                echo "... (middle truncated by the report) ..."
                tail -c 120000 "$RUNNER_TEMP/full.log"
              fi
            else
              echo "(no full.log)"
            fi
            echo '```'
            echo "## log inventory"
            echo '```'
            d=UniXNU-droidvm/out/droidvm/build-all/logs
            if [ -d "$d" ]; then
              find "$d" -name '*.log' 2>/dev/null | while read -r f; do printf '%10s %s\n' "$(wc -c < "$f")" "$(basename "$f")"; done | sort -rn | head -30
            fi
            echo '```'
            echo "## kernel.log undefined symbols"
            echo '```'
            grep -nE "Undefined symbols|_native_|_droidvm_|ld: symbol|error:" "$d/kernel.log" 2>/dev/null | head -50
            echo '```'
            echo "## verdict"
            echo '```'
            if [ -d "UniXNU-droidvm/out/droidvm/release" ]; then
              echo "release: $(ls UniXNU-droidvm/out/droidvm/release | tr '\n' ' ')"
            else
              echo "release MISSING"
            fi
            du -sh "UniXNU-droidvm/out/droidvm" "UniXNU/out/ipsw" "UniXNU/out-reference" 2>/dev/null
            echo '```'
          } > "$OUT"
          echo "report is $(wc -c < "$OUT") bytes"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}" repo-status
          cd repo-status || exit 0
          mkdir -p status
          cp "$OUT" "status/run-${RUN_ID}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "status/run-${RUN_ID}.md"
          git commit -m "report for run ${RUN_ID}" || exit 0
          git push || echo "push failed"
