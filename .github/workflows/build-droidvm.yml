# build-droidvm: UniXNU-droidvm release set on a GitHub macOS runner
#
# stage=kernel  introspect only (list steps, show config) -- cheap, no build
# stage=full    everything below
#
# Stage selection from a push: the commit message carries [full] for the full run.
#
# BOTH REPOSITORIES ARE PINNED, AS A PAIR (2026-10-29 05:50, the author committed them together):
#   device b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13  "Display: GopFramebuffer's half-float offers ..."
#   UniXNU 56023cdc363249d201328e9e147f7b05690eba4e  "GPU parity ... GopFramebuffer merged",
#          "for this board's iPadOS 17 guest (its iPadOS 27 / arm64e port is left for when it reaches main)"
#
# Why: wip/hackintosh moved to the iPadOS 27 board (every commit since 2026-11-03 is "ipados27: ...").
# The root board (iPadOS 17.7.11) is the only one with scripts/build-droidvm-all.py, but package/ is
# SHARED with the 27 board and references symbols only the 27 board defines, so at the tip the kernel
# link cannot resolve _droidvm_gpu_sandbox_decides / _native_hid_pen_allocate / ... (runs 43208533681,
# 43213620917, 43217065598). Pinning the device alone then broke the other way: UniXNU at its tip
# compiles drivers/GopFramebuffer/NativeLegacyDisplay.cpp against a class hierarchy the October device
# repository does not know (run 43220998711, 76 errors). The pair above is the fix, and with it the
# kernel (152 s) and package steps pass (run 43225566396).
#
# HOST TOOLS: gnu-sed must be installed because the tools step builds toybox with gsed (run
# 43225566396). Do NOT put gnu-sed's or coreutils' libexec/gnubin on PATH: that shadows BSD sed, and
# the kernel build scripts call `sed -i ''`, which GNU sed rejects -- run 43229956762 died seconds into
# the reference kernel build for exactly that reason. brew links `gsed` on its own; that is enough.
#
# Two more things learned the hard way:
#
# 1. The overlay (Droid-VM/macOS-DroidVM/overlay/droidvm) is mandatory: its drivers supply the
#    virtio-pci transport the app's crosvm needs (`--block` is virtio-pci there).
# 2. build-droidvm-all.py's own `reference` step cannot be used once the overlay is on: it derives
#    the reference config by copying droidvm_defconfig and flipping flags to n, so it keeps
#    CONFIG_XNU_EXTRA_LD_ARCHIVES pointing at build/virtio-pci/libVirtioPciDrivers.a while its
#    shortened archive list never builds it:
#      ld: library '.../tree/build/virtio-pci/libVirtioPciDrivers.a' not found   (run 43213620917)
#    The supported path is mainline.yml's: a whole second device repository from
#    scripts/make-reference-device.py (which also clears every *_ARCHIVE). That build takes ~8 min
#    and needs only KernelCache, so it runs first, then the pipeline resumes from `kernel`.
#
# Reporting hooks (the Actions log API needs admin rights):
#   ::warning:: annotations, plus status/run-<id>.md committed back with full.log whole.

name: build droidvm release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: kernel = introspect only; full = the whole release set
        type: choice
        options:
          - kernel
          - full
        default: kernel
      unixnu_ref:
        description: UniXNU ref; the default is the pinned half of the matched pair
        default: 56023cdc363249d201328e9e147f7b05690eba4e
      device_ref:
        description: UniXNU-droidvm ref; the default is the pinned half of the matched pair
        default: b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13
      xcode:
        description: Xcode on the image; empty = runner default
        default: ""
      unique_chip_id:
        description: 16 hex digits; only used by stage=full
        default: ""
      only:
        description: Optional --only STEP,... for the pipeline phase
        default: ""
  push:
    paths:
      - "trigger/**"

permissions:
  contents: write

env:
  BOARD: droidvm
  IPSW_BUILD: "21H461"
  STAGE: ${{ github.event.inputs.stage || (contains(github.event.head_commit.message, '[full]') && 'full' || 'kernel') }}
  UNIXNU_REF: ${{ github.event.inputs.unixnu_ref || '56023cdc363249d201328e9e147f7b05690eba4e' }}
  DEVICE_REF: ${{ github.event.inputs.device_ref || 'b8e5279d6c34a2aed8d72d4ec07ffdc5c2e6cb13' }}
  XCODE: ${{ github.event.inputs.xcode || '' }}
  ONLY: ${{ github.event.inputs.only || '' }}
  CHIP_DEFAULT: "0123456789abcdef"
  GITHUB_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Check out the ci harness (overlay + board scripts)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/macOS-DroidVM
          ref: main
          path: ci
          persist-credentials: false

      - name: Check out UniXNU (Droid-VM fork)
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: Droid-VM/UniXNU-droidvm
          ref: ${{ env.DEVICE_REF }}
          path: UniXNU-droidvm
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pick Xcode and report the toolchain
        run: |
          if [ -n "$XCODE" ]; then sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"; fi
          echo "stage: $STAGE"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VER="$(xcodebuild -version | tr '\n' ' ')"
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null)"
          echo "::warning::toolchain | ${XCODE_VER}| iPhoneOS SDK ${SDK_VER} | macOS $(sw_vers -productVersion) $(uname -m) | stage=${STAGE}"

      # gnu-sed is required (toybox wants gsed). Nothing is added to PATH: BSD sed must stay first,
      # the kernel scripts call `sed -i ''`. bison and flex only add bison/yacc/flex/lex.
      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc gnu-sed pkg-config meson bison flex \
                       gettext texinfo autoconf automake libtool gperf nasm
          for formula in bison flex; do
            if [ -d "$(brew --prefix "$formula")" ]; then echo "$(brew --prefix "$formula")/bin" >> "$GITHUB_PATH"; fi
          done
          MISSING=""
          for tool in cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild gsed pkg-config meson bison flex; do
            path="$(command -v "$tool" || true)"
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || MISSING="$MISSING $tool"
          done
          printf 'sed      %s\n' "$(command -v sed)"
          sed -i '' -e 's/^/x/; s/^x//' /dev/null 2>/dev/null && echo 'bsd sed syntax OK' || echo '::warning::sed -i "" failed (is GNU sed first on PATH?)'
          if [ -n "$MISSING" ]; then echo "::warning::missing host tools:$MISSING"; else echo "::warning::host tools OK"; fi

      - name: Apply the overlay and derive the reference device
        run: |
          git -C UniXNU-droidvm log --oneline -1 | tee "$RUNNER_TEMP/overlay.log"
          git -C UniXNU log --oneline -1 | tee -a "$RUNNER_TEMP/overlay.log"
          mkdir -p UniXNU-droidvm/patches/xnu
          cp ci/overlay/$BOARD/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/
          mkdir -p UniXNU-droidvm/drivers
          cp -R ci/overlay/$BOARD/drivers/. UniXNU-droidvm/drivers/
          cp -R ci/overlay/$BOARD/scripts/. UniXNU-droidvm/scripts/
          cp -n UniXNU/patches/xnu/*.patch UniXNU-droidvm/patches/xnu/
          cp -R UniXNU-droidvm device-ref
          python3 ci/scripts/make-reference-device.py device-ref "${BOARD}_defconfig" 2>&1 | tee -a "$RUNNER_TEMP/overlay.log"
          python3 ci/scripts/apply-overlay-board.py UniXNU-droidvm "${BOARD}_defconfig" 2>&1 | tee -a "$RUNNER_TEMP/overlay.log"
          echo "--- overlay drivers ---" | tee -a "$RUNNER_TEMP/overlay.log"
          ls ci/overlay/$BOARD/drivers | tee -a "$RUNNER_TEMP/overlay.log"
          echo "--- device EXTRA_LD_ARCHIVES ---" | tee -a "$RUNNER_TEMP/overlay.log"
          grep -n 'EXTRA_LD_ARCHIVES' UniXNU-droidvm/configs/${BOARD}_defconfig | tee -a "$RUNNER_TEMP/overlay.log"
          echo "--- device-ref EXTRA_LD_ARCHIVES (must be empty) ---" | tee -a "$RUNNER_TEMP/overlay.log"
          grep -n 'EXTRA_LD_ARCHIVES' device-ref/configs/${BOARD}_defconfig | tee -a "$RUNNER_TEMP/overlay.log"

      - name: Cache the Apple source feed
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ hashFiles('UniXNU/feeds.toml', 'UniXNU-droidvm/feeds.toml') }}

      - name: Cache the extracted IPSW members
        uses: actions/cache@v4
        with:
          path: UniXNU/out/ipsw
          key: ipsw-${{ env.IPSW_BUILD }}

      - name: Introspect (stage kernel)
        if: env.STAGE == 'kernel'
        working-directory: UniXNU-droidvm
        run: |
          python3 scripts/build-droidvm-all.py --list 2>&1 | tee "$RUNNER_TEMP/steps.log"

      # The reference candidate: this board's kernel with the native storage / display / owner-root
      # drivers off, built from device-ref. The storage audit reads it while the real kernel links.
      - name: Build the reference candidate (stage full)
        if: env.STAGE == 'full'
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig "${BOARD}_defconfig" -D ../device-ref 2>&1 | tee "$RUNNER_TEMP/ref.log"
          ./unixnu fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu ipsw fetch 2>&1 | tee -a "$RUNNER_TEMP/ref.log"
          ./unixnu build kernel -j "$(sysctl -n hw.ncpu)" 2>&1 | tee "$RUNNER_TEMP/ref-kernel.log"
          mkdir -p "$RUNNER_TEMP/ref"
          cp "out/$BOARD/kernel/kernel.macho" "out/$BOARD/kernel/kernel.json" "$RUNNER_TEMP/ref/"
          ls -l "$RUNNER_TEMP/ref"
          echo "::warning::reference candidate built: $(wc -c < "$RUNNER_TEMP/ref/kernel.macho") bytes"

      - name: Pipeline up to data-base (stage full)
        if: env.STAGE == 'full'
        working-directory: UniXNU-droidvm
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build-droidvm-all.py --to data-base 2>&1 | tee "$RUNNER_TEMP/full1.log"

      - name: Place the reference candidate in the tree (stage full)
        if: env.STAGE == 'full'
        run: |
          ref="UniXNU-droidvm/out/droidvm/tree/build/reference-candidate"
          mkdir -p "$ref"
          cp "$RUNNER_TEMP/ref/kernel.macho" "$RUNNER_TEMP/ref/kernel.json" "$ref/"
          ls -l "$ref"

      - name: Pipeline from kernel to images (stage full)
        if: env.STAGE == 'full'
        working-directory: UniXNU-droidvm
        env:
          SECRET_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          INPUT_CHIP_ID: ${{ github.event.inputs.unique_chip_id || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chip="${INPUT_CHIP_ID:-${SECRET_CHIP_ID:-$CHIP_DEFAULT}}"
          if ! echo "$chip" | grep -Eq '^[0-9a-fA-F]{16}$'; then
            echo "::error::chip id must be exactly 16 hex digits, got '$chip'"
            exit 1
          fi
          echo "::add-mask::$chip"
          if [ -n "$ONLY" ]; then
            python3 scripts/build-droidvm-all.py --unique-chip-id "$chip" --only "$ONLY" 2>&1 | tee "$RUNNER_TEMP/full.log"
          else
            python3 scripts/build-droidvm-all.py --unique-chip-id "$chip" --from kernel 2>&1 | tee "$RUNNER_TEMP/full.log"
          fi

      - name: Show what came out (stage full)
        if: always() && env.STAGE == 'full'
        working-directory: UniXNU-droidvm
        run: |
          for d in out/droidvm/release out/droidvm/build-all out/droidvm/tree/build/reference-candidate; do
            echo "== $d"
            ls -la "$d" 2>/dev/null || echo "(missing)"
          done
          if [ -d out/droidvm/release ]; then
            echo "::warning::stage full produced: $(ls out/droidvm/release | tr '\n' ' ')"
          else
            echo "::warning::stage full produced NO release directory"
          fi

      - name: Pack and encrypt (stage full)
        id: pack
        if: always() && env.STAGE == 'full'
        working-directory: UniXNU-droidvm
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if [ ! -d out/droidvm/release ]; then
            echo "::warning::no release directory to pack -- skipping the artifact"
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/droidvm-release.tgz" -C out/droidvm release
          ls -lh "$RUNNER_TEMP/droidvm-release.tgz"
          if [ -z "$ARTIFACT_KEY" ]; then
            echo "::error::ARTIFACT_KEY secret is not set; refusing to upload unencrypted Apple binaries"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/droidvm-release.tgz" -out "$RUNNER_TEMP/droidvm-release.tgz.enc"
          ls -lh "$RUNNER_TEMP/droidvm-release.tgz.enc"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Upload the encrypted release
        if: always() && steps.pack.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-release-enc
          path: ${{ runner.temp }}/droidvm-release.tgz.enc
          compression-level: 0
          retention-days: 7

      - name: Publish a run report into the repo
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/report.md"
          {
            echo "# run $RUN_ID"
            echo
            echo "- stage: $STAGE"
            echo "- refs: UniXNU@$UNIXNU_REF  device@$DEVICE_REF"
            echo
            echo "## toolchain"
            echo '```'
            sw_vers; uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
            echo '```'
            echo "## pinned checkouts, overlay, reference device"
            echo '```'
            cat "$RUNNER_TEMP/overlay.log" 2>/dev/null
            echo '```'
            echo "## reference candidate"
            echo '```'
            tail -n 30 "$RUNNER_TEMP/ref.log" 2>/dev/null
            echo '--- kernel ---'
            tail -n 30 "$RUNNER_TEMP/ref-kernel.log" 2>/dev/null
            ls -l "$RUNNER_TEMP/ref" 2>/dev/null
            echo '```'
            echo "## reference candidate in tree"
            echo '```'
            ls -l UniXNU-droidvm/out/droidvm/tree/build/reference-candidate 2>&1
            echo '```'
            for f in full1.log full.log; do
              [ -s "$RUNNER_TEMP/$f" ] || continue
              echo "## $f"
              echo '```'
              sz=$(wc -c < "$RUNNER_TEMP/$f")
              echo "size: $sz bytes"
              if [ "$sz" -lt 200000 ]; then
                cat "$RUNNER_TEMP/$f"
              else
                head -c 100000 "$RUNNER_TEMP/$f"
                echo
                echo "... (middle truncated) ..."
                tail -c 100000 "$RUNNER_TEMP/$f"
              fi
              echo '```'
            done
            echo "## log inventory"
            echo '```'
            d=UniXNU-droidvm/out/droidvm/build-all/logs
            if [ -d "$d" ]; then
              find "$d" -name '*.log' 2>/dev/null | while read -r f; do printf '%10s %s\n' "$(wc -c < "$f")" "$(basename "$f")"; done | sort -rn | head -25
            fi
            echo '```'
            echo "## last build log tails"
            for name in tool-toybox tool-gfxprobe tool-lsdiag tool-ipatool plugin kernel package; do
              f="$d/$name.log"
              [ -s "$f" ] || continue
              echo "### $name"
              echo '```'
              tail -n 20 "$f"
              echo '```'
            done
            echo "## verdict"
            echo '```'
            if [ -d "UniXNU-droidvm/out/droidvm/release" ]; then
              echo "release: $(ls UniXNU-droidvm/out/droidvm/release | tr '\n' ' ')"
            else
              echo "release MISSING"
            fi
            du -sh "UniXNU-droidvm/out/droidvm" "UniXNU/out/ipsw" 2>/dev/null
            echo '```'
          } > "$OUT"
          echo "report is $(wc -c < "$OUT") bytes"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}" repo-status
          cd repo-status || exit 0
          mkdir -p status
          cp "$OUT" "status/run-${RUN_ID}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "status/run-${RUN_ID}.md"
          git commit -m "report for run ${RUN_ID}" || exit 0
          git push || echo "push failed"
